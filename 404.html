<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Rustmaninoff</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Page not found on the Rustmaninoff site.">
  <script>
    (function () {
      var m = location.pathname.match(/^(.*\/rustmaninoff)\/?/);
      if (m) {
        var b = document.createElement("base");
        b.href = m[1] + "/";
        document.head.appendChild(b);
      }
    })();
  </script>
  <link rel="icon" href="img/logo.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap" style="padding-top:4rem;text-align:center;">
    <p class="kicker">404</p>
    <h1>Page not found</h1>
    <p class="lede">That path is not on this site.</p>
    <a class="btn btn-primary" href="index.html">Home</a>
  </div>
</body>
</html>
