name: docker

on:
  push:
    branches: [main]
    # Tag builds are dispatched from release.yml after assets exist (avoids curl 404 race).
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (e.g. 0.4.1). Empty = latest published release.
        required: false
        default: ""
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read
  packages: write

env:
  # Pack release binaries (no cargo under QEMU). Override with BUILD_MODE=source if needed.
  BUILD_MODE: release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
            version="${version#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Using release binaries for v${version}"

      - name: Wait for Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for asset in \
            rustmaninoff-x86_64-unknown-linux-gnu.tar.gz \
            rustmaninoff-aarch64-unknown-linux-gnu.tar.gz
          do
            url="https://github.com/${repo}/releases/download/v${VERSION}/${asset}"
            echo "Waiting for ${url}"
            ok=0
            for _ in $(seq 1 60); do
              code="$(curl -fsSIL -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" "$url" || true)"
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "timed out waiting for ${asset}" >&2
              exit 1
            fi
          done
          echo "Release assets ready for v${VERSION}"

      # QEMU only executes the thin download stage for arm64 (seconds), not a full cargo build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},value=v${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_MODE=${{ env.BUILD_MODE }}
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
