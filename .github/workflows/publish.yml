name: publish-crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semver to publish without leading v (e.g. 0.6.8)
        required: true
        type: string

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "invalid version: ${version}" >&2
            exit 1
          fi
          crates=(
            rustmaninoff-ir
            rustmaninoff-engine
            rustmaninoff-report
            rustmaninoff-parser-terraform
            rustmaninoff-parser-cfn
            rustmaninoff-parser-k8s
            rustmaninoff-parser-docker
            rustmaninoff
          )
          crate_on_index() {
            local crate="$1"
            local ver="$2"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: rustmaninoff-publish (github-actions)' \
              "https://crates.io/api/v1/crates/${crate}/${ver}")" || return 1
            [ "$code" = "200" ]
          }
          publish_or_skip() {
            local crate="$1"
            set +e
            local out status
            out="$(cargo publish -p "${crate}" --locked 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              printf '%s\n' "$out"
              return 0
            fi
            if printf '%s\n' "$out" | grep -qiE 'already (uploaded|exists)'; then
              echo "Skipping ${crate} ${version}: already on crates.io (cargo publish)"
              return 0
            fi
            printf '%s\n' "$out" >&2
            return "$status"
          }
          for crate in "${crates[@]}"; do
            if crate_on_index "${crate}" "${version}"; then
              echo "Skipping ${crate} ${version}: already on crates.io"
              continue
            fi
            echo "Publishing ${crate} ${version}"
            publish_or_skip "${crate}"
            echo "Waiting for crates.io index ..."
            sleep 45
          done