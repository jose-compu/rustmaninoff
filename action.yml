name: Rustmaninoff
description: >-
  Fast Checkov-compatible IaC security scanner for Terraform, CloudFormation,
  Kubernetes, and Dockerfiles. CKV policies, checksum-verified binary, SARIF for
  GitHub Code Scanning. Checkov alternative for CI attribute gates; use next to Trivy.
author: jose-compu
branding:
  icon: shield
  color: orange

inputs:
  path:
    description: Path to scan
    required: false
    default: "."
  version:
    description: rustmaninoff release version (without leading v), or "latest"
    required: false
    default: "0.4.1"
  fail-on:
    description: Minimum severity that fails the job (LOW, MEDIUM, HIGH, CRITICAL)
    required: false
    default: "HIGH"
  output:
    description: Comma-separated outputs (cli, json, sarif, junit)
    required: false
    default: "sarif"
  sarif-file:
    description: SARIF output path when sarif is requested
    required: false
    default: "rustmaninoff.sarif"
  args:
    description: Extra CLI arguments appended to `rustmaninoff scan` (trusted input; restricted character set)
    required: false
    default: ""
  github-token:
    description: Token for downloading the release binary (defaults to github.token)
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: Path to the SARIF file when sarif is requested
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install rustmaninoff
      shell: bash
      env:
        # Pass inputs via env to avoid ${{ }} interpolation into the script body (command injection).
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        version="${INPUT_VERSION}"
        if [ "$version" != "latest" ]; then
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "invalid version input (expected semver or 'latest'): ${INPUT_VERSION}" >&2
            exit 1
          fi
        fi

        os="$(uname -s)"
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) arch=x86_64 ;;
          aarch64|arm64) arch=aarch64 ;;
          *) echo "unsupported arch: $arch" >&2; exit 1 ;;
        esac
        case "$os" in
          Linux) target="${arch}-unknown-linux-gnu" ;;
          Darwin) target="${arch}-apple-darwin" ;;
          *) echo "unsupported OS: $os" >&2; exit 1 ;;
        esac

        curl_auth=()
        if [ -n "${GH_TOKEN:-}" ]; then
          curl_auth=(-H "Authorization: Bearer ${GH_TOKEN}")
        fi

        if [ "$version" = "latest" ]; then
          api="https://api.github.com/repos/jose-compu/rustmaninoff/releases/latest"
          tag="$(curl -fsSL "${curl_auth[@]}" -H "Accept: application/vnd.github+json" "$api" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          if [ -z "$tag" ] || ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "failed to resolve a valid latest release tag" >&2
            exit 1
          fi
        else
          tag="v${version}"
        fi

        asset="rustmaninoff-${target}.tar.gz"
        base="https://github.com/jose-compu/rustmaninoff/releases/download/${tag}"
        url="${base}/${asset}"
        sum_url="${base}/${asset}.sha256"
        echo "Downloading ${url}"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "${curl_auth[@]}" -o "$tmp/$asset" "$url"
        curl -fsSL "${curl_auth[@]}" -o "$tmp/$asset.sha256" "$sum_url"

        (
          cd "$tmp"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$asset.sha256"
          else
            expected="$(awk '{print $1}' "$asset.sha256")"
            actual="$(shasum -a 256 "$asset" | awk '{print $1}')"
            if [ "$expected" != "$actual" ]; then
              echo "checksum mismatch for ${asset}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            fi
            echo "${asset}: OK"
          fi
        )

        tar -xzf "$tmp/$asset" -C "$tmp"
        if [ ! -f "$tmp/rustmaninoff" ]; then
          echo "release archive missing rustmaninoff binary" >&2
          exit 1
        fi
        install -m 0755 "$tmp/rustmaninoff" "$RUNNER_TEMP/rustmaninoff"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/rustmaninoff" --version

    - name: Scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        path="${INPUT_PATH}"
        fail_on="${INPUT_FAIL_ON}"
        output="${INPUT_OUTPUT}"
        sarif_file="${INPUT_SARIF_FILE}"
        args="${INPUT_ARGS}"

        # Reject metacharacters that would enable shell injection if ever mis-expanded.
        safe_path='^[A-Za-z0-9._/=@+-][A-Za-z0-9._/=@+ -]*$'
        if [ -z "$path" ] || ! [[ "$path" =~ $safe_path ]]; then
          echo "invalid path input" >&2
          exit 1
        fi
        if ! [[ "$fail_on" =~ ^(LOW|MEDIUM|HIGH|CRITICAL)$ ]]; then
          echo "invalid fail-on input (expected LOW|MEDIUM|HIGH|CRITICAL)" >&2
          exit 1
        fi
        if ! [[ "$output" =~ ^(cli|json|sarif|junit)(,(cli|json|sarif|junit))*$ ]]; then
          echo "invalid output input (expected comma-separated cli,json,sarif,junit)" >&2
          exit 1
        fi
        if ! [[ "$sarif_file" =~ ^[A-Za-z0-9._/=@+-][A-Za-z0-9._/=@+ -]*$ ]]; then
          echo "invalid sarif-file input" >&2
          exit 1
        fi
        # Extra args are optional; allow a conservative CLI character set only.
        if [ -n "$args" ] && ! [[ "$args" =~ ^[A-Za-z0-9_./=,:@+ -]+$ ]]; then
          echo "invalid args input (forbidden characters)" >&2
          exit 1
        fi

        cmd=(rustmaninoff scan "$path" --fail-on "$fail_on" --output "$output")
        case ",${output}," in
          *,sarif,*) cmd+=(--sarif-file "$sarif_file") ;;
        esac
        if [ -n "$args" ]; then
          # Word-split only after character allowlist validation above.
          # shellcheck disable=SC2206
          extra=( $args )
          cmd+=("${extra[@]}")
        fi
        "${cmd[@]}"
