[workspace]
resolver = "2"
members = [
    "crates/ir",
    "crates/engine",
    "crates/parser-terraform",
    "crates/parser-cfn",
    "crates/parser-k8s",
    "crates/report",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
regex = "1"
rustmaninoff-ir = { version = "0.1.0", path = "crates/ir" }
rustmaninoff-engine = { version = "0.1.0", path = "crates/engine" }
rustmaninoff-parser-terraform = { version = "0.1.0", path = "crates/parser-terraform" }
rustmaninoff-parser-cfn = { version = "0.1.0", path = "crates/parser-cfn" }
rustmaninoff-parser-k8s = { version = "0.1.0", path = "crates/parser-k8s" }
rustmaninoff-report = { version = "0.1.0", path = "crates/report" }
