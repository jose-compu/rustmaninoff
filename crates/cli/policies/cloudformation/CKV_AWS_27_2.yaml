metadata:
  id: CKV_AWS_27
  name: Ensure all data stored in the SQS queue is encrypted
  category: ENCRYPTION
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_27. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::SQS::Queue
definition:
  or:
  - cond_type: attribute
    attribute: SqsManagedSseEnabled
    operator: is_true
  - cond_type: attribute
    attribute: KmsMasterKeyId
    operator: exists
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::SQS::Queue\n    Properties:\n      QueueName: plain\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Sse:\n    Type: AWS::SQS::Queue\n    Properties:\n      SqsManagedSseEnabled: true\n  Kms:\n    Type: AWS::SQS::Queue\n    Properties:\n      KmsMasterKeyId: alias/aws/sqs\n"