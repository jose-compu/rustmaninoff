metadata:
  id: CKV_AWS_157
  name: Ensure that RDS instances have Multi-AZ enabled
  category: BACKUP_AND_RECOVERY
  severity: MEDIUM
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_157. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::RDS::DBInstance
definition:
  cond_type: attribute
  attribute: MultiAZ
  operator: equals
  value: true
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::RDS::DBInstance\n    Properties:\n \
    \     MultiAZ: false\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::RDS::DBInstance\n    Properties:\n\
    \      MultiAZ: true\n"
