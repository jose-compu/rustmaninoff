metadata:
  id: CKV_AWS_56
  name: Ensure S3 bucket has RestrictPublicBuckets enabled
  category: STORAGE
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_56. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::S3::Bucket
definition:
  cond_type: attribute
  attribute: PublicAccessBlockConfiguration.RestrictPublicBuckets
  operator: equals
  value: true
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::S3::Bucket\n    Properties:\n      PublicAccessBlockConfiguration:\n\
    \        RestrictPublicBuckets: false\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::S3::Bucket\n    Properties:\n     \
    \ PublicAccessBlockConfiguration:\n        RestrictPublicBuckets: true\n"
