metadata:
  id: CKV_AWS_4
  name: Ensure the CloudWatch Log Group is encrypted by a KMS key
  category: ENCRYPTION
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_4. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::Logs::LogGroup
definition:
  cond_type: attribute
  attribute: KmsKeyId
  operator: exists
fixtures:
  fail: |
    AWSTemplateFormatVersion: "2010-09-09"
    Resources:
      Bad:
        Type: AWS::Logs::LogGroup
        Properties:
          LogGroupName: app
  pass: |
    AWSTemplateFormatVersion: "2010-09-09"
    Resources:
      Good:
        Type: AWS::Logs::LogGroup
        Properties:
          LogGroupName: app
          KmsKeyId: arn:aws:kms:us-east-1:123:key/abc
