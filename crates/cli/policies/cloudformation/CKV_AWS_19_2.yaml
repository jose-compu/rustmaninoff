metadata:
  id: CKV_AWS_19
  name: Ensure the S3 bucket has server-side-encryption enabled
  category: ENCRYPTION
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_19. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::S3::Bucket
definition:
  cond_type: attribute
  attribute: BucketEncryption.ServerSideEncryptionConfiguration.ServerSideEncryptionByDefault.SSEAlgorithm
  operator: within
  value:
  - AES256
  - aws:kms
  missing: pass
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::S3::Bucket\n    Properties:\n      BucketEncryption:\n\
    \        ServerSideEncryptionConfiguration:\n          - ServerSideEncryptionByDefault:\n              SSEAlgorithm: none\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::S3::Bucket\n    Properties:\n     \
    \ BucketEncryption:\n        ServerSideEncryptionConfiguration:\n          - ServerSideEncryptionByDefault:\n        \
    \      SSEAlgorithm: AES256\n"
