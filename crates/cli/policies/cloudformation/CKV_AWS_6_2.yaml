metadata:
  id: CKV_AWS_6
  name: Ensure Elasticsearch has node-to-node encryption enabled
  category: ENCRYPTION
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_6. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::Elasticsearch::Domain
definition:
  cond_type: attribute
  attribute: NodeToNodeEncryptionOptions.Enabled
  operator: equals
  value: true
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::Elasticsearch::Domain\n    Properties:\n\
    \      NodeToNodeEncryptionOptions:\n        Enabled: false\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::Elasticsearch::Domain\n    Properties:\n\
    \      NodeToNodeEncryptionOptions:\n        Enabled: true\n"
