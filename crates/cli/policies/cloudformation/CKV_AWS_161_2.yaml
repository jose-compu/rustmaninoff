metadata:
  id: CKV_AWS_161
  name: Ensure RDS database has IAM authentication enabled
  category: IAM
  severity: MEDIUM
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_161. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::RDS::DBInstance
definition:
  cond_type: attribute
  attribute: EnableIAMDatabaseAuthentication
  operator: equals
  value: true
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::RDS::DBInstance\n    Properties:\n \
    \     EnableIAMDatabaseAuthentication: false\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::RDS::DBInstance\n    Properties:\n\
    \      EnableIAMDatabaseAuthentication: true\n"
