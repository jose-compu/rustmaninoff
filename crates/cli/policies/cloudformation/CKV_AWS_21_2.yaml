metadata:
  id: CKV_AWS_21
  name: Ensure the S3 bucket has versioning enabled
  category: BACKUP_AND_RECOVERY
  severity: MEDIUM
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_21. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::S3::Bucket
definition:
  cond_type: attribute
  attribute: VersioningConfiguration.Status
  operator: equals
  value: Enabled
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::S3::Bucket\n    Properties:\n      VersioningConfiguration:\n\
    \        Status: Suspended\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::S3::Bucket\n    Properties:\n     \
    \ VersioningConfiguration:\n        Status: Enabled\n"
