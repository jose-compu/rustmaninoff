metadata:
  id: CKV_AWS_149
  name: Ensure that Secrets Manager secret is encrypted using KMS CMK
  category: ENCRYPTION
  severity: MEDIUM
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_149. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::SecretsManager::Secret
definition:
  cond_type: attribute
  attribute: KmsKeyId
  operator: exists
