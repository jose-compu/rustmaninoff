  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::SecretsManager::Secret\n    Properties:\n\
    \      Name: app\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::SecretsManager::Secret\n    Properties:\n\
    \      KmsKeyId: alias/app\n"
