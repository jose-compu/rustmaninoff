metadata:
  id: CKV_AWS_17
  name: Ensure all data stored in RDS is not publicly accessible
  category: NETWORKING
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_17. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::RDS::DBInstance
definition:
  cond_type: attribute
  attribute: PubliclyAccessible
  operator: not_equals
  value: true
  missing: pass
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::RDS::DBInstance\n    Properties:\n \
    \     PubliclyAccessible: true\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::RDS::DBInstance\n    Properties:\n\
    \      PubliclyAccessible: false\n"
