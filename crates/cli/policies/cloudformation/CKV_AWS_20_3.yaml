metadata:
  id: CKV_AWS_20
  name: Ensure the S3 bucket does not allow READ permissions to everyone
  category: STORAGE
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_20. https://github.com/bridgecrewio/checkov
resource_types:
- AWS::S3::Bucket
definition:
  cond_type: attribute
  attribute: AccessControl
  operator: not_within
  value:
  - PublicRead
  - PublicReadWrite
  missing: pass
fixtures:
  fail: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Bad:\n    Type: AWS::S3::Bucket\n    Properties:\n      AccessControl:\
    \ PublicRead\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::S3::Bucket\n    Properties:\n     \
    \ AccessControl: Private\n"
