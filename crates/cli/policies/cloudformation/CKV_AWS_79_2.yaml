    \      LaunchTemplateData:\n        MetadataOptions:\n          HttpTokens: optional\n"
  pass: "AWSTemplateFormatVersion: \"2010-09-09\"\nResources:\n  Good:\n    Type: AWS::EC2::LaunchTemplate\n    Properties:\n\
