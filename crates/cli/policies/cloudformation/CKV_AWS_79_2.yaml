  name: Ensure Instance Metadata Service Version 1 is not enabled
  category: GENERAL_SECURITY
  severity: HIGH
  framework: cloudformation
  guidelines: Adapted from Checkov CKV_AWS_79. https://github.com/bridgecrewio/checkov
