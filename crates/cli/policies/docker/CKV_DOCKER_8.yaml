metadata:
  id: CKV_DOCKER_8
  name: Ensure the last USER is not root
  category: APPLICATION_SECURITY
  severity: HIGH
  framework: docker
  guidelines: Adapted from Checkov CKV_DOCKER_8. https://github.com/bridgecrewio/checkov
resource_types:
- dockerfile
definition:
  or:
  - cond_type: attribute
    attribute: USER
    operator: not_exists
  - and:
    - cond_type: attribute
      attribute: USER
      operator: not_equals
      value: root
    - cond_type: attribute
      attribute: USER
      operator: not_equals
      value: "0"
fixtures:
  fail: |
    FROM nginx:1.27
    USER root
  pass: |
    FROM nginx:1.27
    USER app
