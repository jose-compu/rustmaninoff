metadata:
  id: CKV_DOCKER_11
  name: Ensure From Alias are unique for multistage builds
  category: CONVENTION
  severity: MEDIUM
  framework: docker
  guidelines: Adapted from Checkov CKV_DOCKER_11. https://github.com/bridgecrewio/checkov
resource_types:
- dockerfile
definition:
  cond_type: attribute
  attribute: _from_aliases
  operator: unique
fixtures:
  fail: |
    FROM alpine:3.19 AS builder
    RUN echo build
    FROM alpine:3.19 AS builder
    USER app
  pass: |
    FROM alpine:3.19 AS builder
    RUN echo build
    FROM alpine:3.19 AS runtime
    USER app
