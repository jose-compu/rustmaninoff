metadata:
  id: CKV_DOCKER_1
  name: Ensure port 22 is not exposed
  category: NETWORKING
  severity: HIGH
  framework: docker
  guidelines: Adapted from Checkov CKV_DOCKER_1 (ExposePort22). https://github.com/bridgecrewio/checkov
resource_types:
- dockerfile
definition:
  or:
  - cond_type: attribute
    attribute: EXPOSE
    operator: not_exists
  - cond_type: attribute
    attribute: EXPOSE
    operator: not_regex_match
    value: '(^|\s)22(/tcp)?(\s|$)'
fixtures:
  fail: |
    FROM nginx:1.27
    EXPOSE 22
    USER app
  pass: |
    FROM nginx:1.27
    EXPOSE 80
    USER app
