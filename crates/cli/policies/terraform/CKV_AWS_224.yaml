metadata:
  id: CKV_AWS_224
  name: Ensure ECS Cluster logging is enabled and client to container communication uses CMK
  category: ENCRYPTION
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_224.
resource_types:
- aws_ecs_cluster
definition:
  and:
  - cond_type: attribute
    attribute: configuration.execute_command_configuration.kms_key_id
    operator: exists
  - cond_type: attribute
    attribute: configuration.execute_command_configuration.logging
    operator: not_equals
    value: NONE
fixtures:
  fail: "resource \"aws_ecs_cluster\" \"bad\" {\n  name = \"bad\"\n}\n"
  pass: "resource \"aws_ecs_cluster\" \"good\" {\n  name = \"good\"\n  configuration {\n    execute_command_configuration\
    \ {\n      kms_key_id = \"arn:aws:kms:us-east-1:123:key/abc\"\n      logging    = \"OVERRIDE\"\n      log_configuration\
    \ {\n        cloud_watch_encryption_enabled = true\n        cloud_watch_log_group_name     = \"/ecs/good\"\n      }\n\
    \    }\n  }\n}\n"
