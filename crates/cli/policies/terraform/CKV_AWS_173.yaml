metadata:
  id: CKV_AWS_173
  name: Check encryption settings for Lambda environmental variable
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_173. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lambda_function
definition:
  or:
  - cond_type: attribute
    attribute: environment
    operator: not_exists
  - cond_type: attribute
    attribute: kms_key_arn
    operator: exists
fixtures:
  fail: "resource \"aws_lambda_function\" \"bad\" {\n  function_name = \"app\"\n  environment {\n    variables = {\n     \
    \ LOG = \"info\"\n    }\n  }\n}\n"
  pass: "resource \"aws_lambda_function\" \"good\" {\n  function_name = \"app\"\n  kms_key_arn = \"arn:aws:kms:us-east-1:123:key/abc\"\
    \n  environment {\n    variables = {\n      LOG = \"info\"\n    }\n  }\n}\n"
