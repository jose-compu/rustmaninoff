metadata:
  id: CKV_AWS_68
  name: CloudFront Distribution should have WAF enabled
  category: APPLICATION_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_68. https://github.com/bridgecrewio/checkov
resource_types:
- aws_cloudfront_distribution
definition:
  cond_type: attribute
  attribute: web_acl_id
  operator: exists
fixtures:
  fail: |
    resource "aws_cloudfront_distribution" "bad" {
      enabled = true
      origin {
        domain_name = "example.com"
        origin_id   = "origin"
      }
      default_cache_behavior {
        allowed_methods        = ["GET", "HEAD"]
        cached_methods         = ["GET", "HEAD"]
        target_origin_id       = "origin"
        viewer_protocol_policy = "redirect-to-https"
      }
      restrictions {
        geo_restriction {
          restriction_type = "none"
        }
      }
      viewer_certificate {
        cloudfront_default_certificate = true
      }
    }
  pass: |
    resource "aws_cloudfront_distribution" "good" {
      enabled    = true
      web_acl_id = "arn:aws:wafv2:us-east-1:123456789012:global/webacl/example/a1b2c3d4"
      origin {
        domain_name = "example.com"
        origin_id   = "origin"
      }
      default_cache_behavior {
        allowed_methods        = ["GET", "HEAD"]
        cached_methods         = ["GET", "HEAD"]
        target_origin_id       = "origin"
        viewer_protocol_policy = "redirect-to-https"
      }
      restrictions {
        geo_restriction {
          restriction_type = "none"
        }
      }
      viewer_certificate {
        cloudfront_default_certificate = true
      }
    }
