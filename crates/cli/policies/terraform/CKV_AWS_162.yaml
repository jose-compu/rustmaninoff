  fail: "resource \"aws_rds_cluster\" \"bad\" {\n  iam_database_authentication_enabled = false\n}\n"
  pass: "resource \"aws_rds_cluster\" \"good\" {\n  iam_database_authentication_enabled = true\n}\n"
