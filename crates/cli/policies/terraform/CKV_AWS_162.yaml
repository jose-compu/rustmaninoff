metadata:
  id: CKV_AWS_162
  name: Ensure RDS cluster has IAM authentication enabled
  category: IAM
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_162. https://github.com/bridgecrewio/checkov
resource_types:
- aws_rds_cluster
definition:
  cond_type: attribute
  attribute: iam_database_authentication_enabled
  operator: equals
