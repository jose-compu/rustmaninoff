metadata:
  id: CKV_AWS_279
  name: Ensure Neptune snapshot is securely encrypted
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_279. https://github.com/bridgecrewio/checkov
resource_types:
- aws_neptune_cluster_snapshot
definition:
  cond_type: attribute
  attribute: storage_encrypted
  operator: is_true
fixtures:
  fail: |
    resource "aws_neptune_cluster_snapshot" "bad" {
      storage_encrypted = false
    }
  pass: |
    resource "aws_neptune_cluster_snapshot" "good" {
      storage_encrypted = true
    }
