metadata:
  id: CKV_AWS_158
  name: Ensure that CloudWatch Log Group is encrypted by KMS
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_158. https://github.com/bridgecrewio/checkov
resource_types:
- aws_cloudwatch_log_group
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: "resource \"aws_cloudwatch_log_group\" \"bad\" {\n  name = \"/app\"\n}\n"
  pass: "resource \"aws_cloudwatch_log_group\" \"good\" {\n  kms_key_id = \"arn:aws:kms:us-east-1:123:key/abc\"\n}\n"
