metadata:
  id: CKV_AWS_341
  name: Ensure Launch template should not have a metadata response hop limit greater than 1
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_341. https://github.com/bridgecrewio/checkov
resource_types:
- aws_launch_configuration
- aws_launch_template
definition:
  or:
  - cond_type: attribute
    attribute: metadata_options.http_put_response_hop_limit
    operator: not_exists
  - cond_type: attribute
    attribute: metadata_options.http_put_response_hop_limit
    operator: equals
    value: 1
fixtures:
  fail: |
    resource "aws_launch_configuration" "bad" {
      metadata_options {
        http_put_response_hop_limit = 99
      }
    }
  pass: |
    resource "aws_launch_configuration" "good" {
      metadata_options {
        http_put_response_hop_limit = 1
      }
    }
