metadata:
  id: CKV_AWS_361
  name: Ensure that Neptune DB cluster has automated backups enabled with adequate retention
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_361. https://github.com/bridgecrewio/checkov
resource_types:
- aws_neptune_cluster
definition:
  cond_type: attribute
  attribute: backup_retention_period
  operator: greater_than_or_equal
  value: 7
fixtures:
  fail: |
    resource "aws_neptune_cluster" "bad" {
      backup_retention_period = 1
    }
  pass: |
    resource "aws_neptune_cluster" "good" {
      backup_retention_period = 7
    }
