metadata:
  id: CKV_AWS_139
  name: Ensure that RDS clusters have deletion protection enabled
  category: BACKUP_AND_RECOVERY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_139. https://github.com/bridgecrewio/checkov
resource_types:
- aws_rds_cluster
definition:
  cond_type: attribute
  attribute: deletion_protection
  operator: equals
  value: true
fixtures:
  fail: "resource \"aws_rds_cluster\" \"bad\" {\n  deletion_protection = false\n}\n"
  pass: "resource \"aws_rds_cluster\" \"good\" {\n  deletion_protection = true\n}\n"
