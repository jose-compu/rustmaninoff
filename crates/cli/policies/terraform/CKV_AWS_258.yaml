metadata:
  id: CKV_AWS_258
  name: Ensure that Lambda function URLs AuthType is not None
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_258. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lambda_function_url
definition:
  or:
  - cond_type: attribute
    attribute: authorization_type
    operator: not_exists
  - cond_type: attribute
    attribute: authorization_type
    operator: not_equals
    value: "NONE"
fixtures:
  fail: |
    resource "aws_lambda_function_url" "bad" {
      authorization_type = "NONE"
    }
  pass: |
    resource "aws_lambda_function_url" "good" {
      authorization_type = "GOOD"
    }
