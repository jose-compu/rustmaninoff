metadata:
  id: CKV_AWS_265
  name: Ensure Keyspaces Table uses CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_265. https://github.com/bridgecrewio/checkov
resource_types:
- aws_keyspaces_table
definition:
  and:
  - cond_type: attribute
    attribute: encryption_specification.type
    operator: equals
    value: CUSTOMER_MANAGED_KMS_KEY
  - cond_type: attribute
    attribute: encryption_specification.kms_key_identifier
    operator: exists
fixtures:
  fail: |
    resource "aws_keyspaces_table" "bad" {
      encryption_specification {
        type = "AWS_OWNED_KMS_KEY"
      }
    }
  pass: |
    resource "aws_keyspaces_table" "good" {
      encryption_specification {
        type               = "CUSTOMER_MANAGED_KMS_KEY"
        kms_key_identifier = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      }
    }
