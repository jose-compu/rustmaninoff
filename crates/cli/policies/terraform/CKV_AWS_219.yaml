metadata:
  id: CKV_AWS_219
  name: Ensure CodePipeline Artifact store is using a KMS CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_219. https://github.com/bridgecrewio/checkov
resource_types:
- aws_codepipeline
definition:
  cond_type: attribute
  attribute: artifact_store.encryption_key.id
  operator: exists
fixtures:
  fail: |
    resource "aws_codepipeline" "bad" {
    }
  pass: |
    resource "aws_codepipeline" "good" {
      artifact_store {
        encryption_key {
          id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
        }
      }
    }
