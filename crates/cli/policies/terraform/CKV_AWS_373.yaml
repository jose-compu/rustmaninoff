metadata:
  id: CKV_AWS_373
  name: Ensure Bedrock Agent is encrypted with a CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_373. https://github.com/bridgecrewio/checkov
resource_types:
- aws_bedrockagent_agent
definition:
  cond_type: attribute
  attribute: customer_encryption_key_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_bedrockagent_agent" "bad" {
    }
  pass: |
    resource "aws_bedrockagent_agent" "good" {
      customer_encryption_key_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
