  name: Ensure EventBridge Scheduler Schedule uses Customer Managed Key (CMK)
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_297. https://github.com/bridgecrewio/checkov
resource_types:
- aws_scheduler_schedule
definition:
  cond_type: attribute
  attribute: kms_key_arn
