metadata:
  id: CKV_AWS_281
  name: Ensure RedShift snapshot copy is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_281. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshift_snapshot_copy_grant
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_redshift_snapshot_copy_grant" "bad" {
    }
  pass: |
    resource "aws_redshift_snapshot_copy_grant" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
