metadata:
  id: CKV_AWS_178
  name: Ensure fx ontap file system is encrypted by KMS using a customer managed Key (CMK)
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_178. https://github.com/bridgecrewio/checkov
resource_types:
- aws_fsx_ontap_file_system
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_fsx_ontap_file_system" "bad" {
      storage_capacity = 1024
      subnet_ids = ["subnet-1"]
      deployment_type = "MULTI_AZ_1"
      throughput_capacity = 128
    }
  pass: |
    resource "aws_fsx_ontap_file_system" "good" {
      storage_capacity = 1024
      subnet_ids = ["subnet-1"]
      deployment_type = "MULTI_AZ_1"
      throughput_capacity = 128
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
