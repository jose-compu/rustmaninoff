metadata:
  id: CKV_AWS_206
  name: Ensure API Gateway Domain uses a modern security Policy
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_206. https://github.com/bridgecrewio/checkov
resource_types:
- aws_api_gateway_domain_name
definition:
  cond_type: attribute
  attribute: security_policy
  operator: within
  value:
  - TLS_1_2
  - SecurityPolicy_TLS12_2018_EDGE
  - SecurityPolicy_TLS12_PFS_2025_EDGE
  - SecurityPolicy_TLS13_1_2_2021_06
  - SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09
  - SecurityPolicy_TLS13_1_2_PQ_2025_09
  - SecurityPolicy_TLS13_1_3_2025_09
  - SecurityPolicy_TLS13_1_3_FIPS_2025_09
  - SecurityPolicy_TLS13_2025_EDGE
fixtures:
  fail: |
    resource "aws_api_gateway_domain_name" "bad" {
      security_policy = "TLS_1_0"
    }
  pass: |
    resource "aws_api_gateway_domain_name" "good" {
      security_policy = "TLS_1_2"
    }
