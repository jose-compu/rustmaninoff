metadata:
  id: CKV_AWS_159
  name: Ensure that Athena Workgroup is encrypted
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_159. https://github.com/bridgecrewio/checkov
resource_types:
- aws_athena_workgroup
definition:
  cond_type: attribute
  attribute: configuration.result_configuration.encryption_configuration.encryption_option
  operator: exists
fixtures:
  fail: |
    resource "aws_athena_workgroup" "bad" {
    }
  pass: |
    resource "aws_athena_workgroup" "good" {
      configuration {
        result_configuration {
          encryption_configuration {
            encryption_option = "arn:aws:kms:us-east-1:123456789012:key/abcd"
          }
        }
      }
    }
