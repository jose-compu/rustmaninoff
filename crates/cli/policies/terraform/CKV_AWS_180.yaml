metadata:
  id: CKV_AWS_180
  name: Ensure Image Builder component is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_180. https://github.com/bridgecrewio/checkov
resource_types:
- aws_imagebuilder_component
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_imagebuilder_component" "bad" {
    }
  pass: |
    resource "aws_imagebuilder_component" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
