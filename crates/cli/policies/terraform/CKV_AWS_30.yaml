metadata:
  id: CKV_AWS_30
  name: Ensure ElastiCache replication group is encrypted in transit
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_30. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticache_replication_group
definition:
  cond_type: attribute
  attribute: transit_encryption_enabled
  operator: equals
  value: true
fixtures:
  fail: "resource \"aws_elasticache_replication_group\" \"bad\" {\n  transit_encryption_enabled = false\n}\n"
  pass: "resource \"aws_elasticache_replication_group\" \"good\" {\n  transit_encryption_enabled = true\n}\n"
