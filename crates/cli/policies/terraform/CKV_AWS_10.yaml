metadata:
  id: CKV_AWS_10
  name: Ensure IAM password policy requires minimum length of 14 or greater
  category: IAM
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_10. https://github.com/bridgecrewio/checkov
resource_types:
- aws_iam_account_password_policy
definition:
  cond_type: attribute
  attribute: minimum_password_length
  operator: greater_than_or_equal
  value: 14
fixtures:
  fail: "resource \"aws_iam_account_password_policy\" \"bad\" {\n  minimum_password_length = 8\n}\n"
  pass: "resource \"aws_iam_account_password_policy\" \"good\" {\n  minimum_password_length = 14\n}\n"
