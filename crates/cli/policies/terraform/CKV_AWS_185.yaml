metadata:
  id: CKV_AWS_185
  name: Ensure Kinesis Stream is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_185. https://github.com/bridgecrewio/checkov
resource_types:
- aws_kinesis_stream
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_kinesis_stream" "bad" {
    }
  pass: |
    resource "aws_kinesis_stream" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
