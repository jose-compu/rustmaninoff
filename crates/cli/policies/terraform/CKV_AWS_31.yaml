metadata:
  id: CKV_AWS_31
  name: Ensure all data stored in the ElastiCache Replication Group is securely encrypted at transit and has auth token
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_31. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticache_replication_group
definition:
  and:
  - cond_type: attribute
    attribute: transit_encryption_enabled
    operator: is_true
  - cond_type: attribute
    attribute: auth_token
    operator: exists
fixtures:
  fail: |
    resource "aws_elasticache_replication_group" "bad" {
      replication_group_id = "rg"
    }
  pass: |
    resource "aws_elasticache_replication_group" "good" {
      replication_group_id       = "rg"
      transit_encryption_enabled = true
      auth_token                 = "supersecret"
    }
