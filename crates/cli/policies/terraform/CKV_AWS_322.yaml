metadata:
  id: CKV_AWS_322
  name: Ensure ElastiCache for Redis cache clusters have auto minor version upgrades enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_322. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticache_cluster
definition:
  or:
  - cond_type: attribute
    attribute: auto_minor_version_upgrade
    operator: not_exists
  - cond_type: attribute
    attribute: auto_minor_version_upgrade
    operator: is_true
fixtures:
  fail: |
    resource "aws_elasticache_cluster" "bad" {
      auto_minor_version_upgrade = false
    }
  pass: |
    resource "aws_elasticache_cluster" "good" {
      auto_minor_version_upgrade = true
    }
