metadata:
  id: CKV_AWS_313
  name: Ensure RDS cluster configured to copy tags to snapshots
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_313. https://github.com/bridgecrewio/checkov
resource_types:
- aws_rds_cluster
definition:
  cond_type: attribute
  attribute: copy_tags_to_snapshot
  operator: is_true
fixtures:
  fail: |
    resource "aws_rds_cluster" "bad" {
      copy_tags_to_snapshot = false
    }
  pass: |
    resource "aws_rds_cluster" "good" {
      copy_tags_to_snapshot = true
    }
