  pass: "resource \"aws_dlm_lifecycle_policy\" \"good\" {\n  description = \"good\"\n  policy_details {\n    schedule {\n\
    \      cross_region_copy_rule {\n        encrypted = true\n        target = \"us-west-2\"\n      }\n    }\n  }\n}\n"
