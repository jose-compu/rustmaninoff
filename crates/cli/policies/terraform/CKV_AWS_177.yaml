metadata:
  id: CKV_AWS_177
  name: Ensure Kinesis Video Stream is encrypted by KMS using a customer managed Key (CMK)
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_177. https://github.com/bridgecrewio/checkov
resource_types:
- aws_kinesis_video_stream
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_kinesis_video_stream" "bad" {
      name = "stream"
    }
  pass: |
    resource "aws_kinesis_video_stream" "good" {
      name = "stream"
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
