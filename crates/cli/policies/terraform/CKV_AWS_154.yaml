metadata:
  id: CKV_AWS_154
  name: Ensure Redshift is not deployed outside of a VPC
  category: NETWORKING
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_154. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshift_cluster
definition:
  cond_type: attribute
  attribute: cluster_subnet_group_name
  operator: exists
fixtures:
  fail: |
    resource "aws_redshift_cluster" "bad" {
      cluster_identifier = "rs"
      node_type = "dc2.large"
    }
  pass: |
    resource "aws_redshift_cluster" "good" {
      cluster_identifier = "rs"
      node_type = "dc2.large"
      cluster_subnet_group_name = "rs-subnet"
    }
