metadata:
  id: CKV_AWS_22
  name: Ensure SageMaker Notebook is encrypted at rest using KMS CMK
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_22. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sagemaker_notebook_instance
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_sagemaker_notebook_instance" "bad" {
      name          = "nb"
      instance_type = "ml.t3.medium"
      role_arn      = "arn:aws:iam::123456789012:role/sagemaker"
    }
  pass: |
    resource "aws_sagemaker_notebook_instance" "good" {
      name          = "nb"
      instance_type = "ml.t3.medium"
      role_arn      = "arn:aws:iam::123456789012:role/sagemaker"
      kms_key_id    = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
