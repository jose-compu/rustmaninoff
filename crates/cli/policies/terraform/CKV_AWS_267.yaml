metadata:
  id: CKV_AWS_267
  name: Ensure that Comprehend Entity Recognizer's model is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_267. https://github.com/bridgecrewio/checkov
resource_types:
- aws_comprehend_entity_recognizer
definition:
  cond_type: attribute
  attribute: model_kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_comprehend_entity_recognizer" "bad" {
    }
  pass: |
    resource "aws_comprehend_entity_recognizer" "good" {
      model_kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
