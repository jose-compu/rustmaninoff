metadata:
  id: CKV_AWS_189
  name: Ensure EBS Volume is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_189. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ebs_volume
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_ebs_volume" "bad" {
    }
  pass: |
    resource "aws_ebs_volume" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
