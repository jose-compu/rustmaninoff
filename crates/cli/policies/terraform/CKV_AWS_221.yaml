metadata:
  id: CKV_AWS_221
  name: Ensure CodeArtifact Domain is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_221. https://github.com/bridgecrewio/checkov
resource_types:
- aws_codeartifact_domain
definition:
  cond_type: attribute
  attribute: encryption_key
  operator: exists
fixtures:
  fail: |
    resource "aws_codeartifact_domain" "bad" {
    }
  pass: |
    resource "aws_codeartifact_domain" "good" {
      encryption_key = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
