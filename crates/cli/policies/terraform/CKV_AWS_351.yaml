metadata:
  id: CKV_AWS_351
  name: Ensure EMR Cluster security configuration encrypts InTransit
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_351. https://github.com/bridgecrewio/checkov
resource_types:
- aws_emr_security_configuration
definition:
  cond_type: attribute
  attribute: configuration
  operator: contains
  value: EnableInTransitEncryption
fixtures:
  fail: |
    resource "aws_emr_security_configuration" "bad" {
      configuration = "plain"
    }
  pass: |
    resource "aws_emr_security_configuration" "good" {
      configuration = "EnableInTransitEncryption=true"
    }
