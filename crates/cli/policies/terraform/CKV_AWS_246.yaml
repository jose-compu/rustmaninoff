metadata:
  id: CKV_AWS_246
  name: Ensure RDS Cluster activity streams are encrypted using KMS CMKs
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_246. https://github.com/bridgecrewio/checkov
resource_types:
- aws_rds_cluster_activity_stream
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_rds_cluster_activity_stream" "bad" {
    }
  pass: |
    resource "aws_rds_cluster_activity_stream" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
