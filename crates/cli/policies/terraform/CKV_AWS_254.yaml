metadata:
  id: CKV_AWS_254
  name: Ensure DLM cross region events are encrypted with Customer Managed Key
  category: ENCRYPTION
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_254.
resource_types:
- aws_dlm_lifecycle_policy
definition:
  and:
  - cond_type: attribute
    attribute: policy_details.action.cross_region_copy.encryption_configuration.encryption
    operator: equals
    value: true
  - cond_type: attribute
    attribute: policy_details.action.cross_region_copy.encryption_configuration.cmk_arn
    operator: exists
fixtures:
  fail: "resource \"aws_dlm_lifecycle_policy\" \"bad\" {\n  description = \"bad\"\n  policy_details {\n    action {\n    \
    \  cross_region_copy {\n        encryption_configuration { encryption = true }\n      }\n    }\n  }\n}\n"
  pass: "resource \"aws_dlm_lifecycle_policy\" \"good\" {\n  description = \"good\"\n  policy_details {\n    action {\n  \
    \    cross_region_copy {\n        encryption_configuration {\n          encryption = true\n          cmk_arn    = \"arn:aws:kms:us-east-1:123:key/abc\"\
    \n        }\n      }\n    }\n  }\n}\n"
