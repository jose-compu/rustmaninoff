metadata:
  id: CKV_AWS_300
  name: Ensure S3 lifecycle configuration sets period for aborting failed uploads
  category: GENERAL_SECURITY
  severity: LOW
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_300.
resource_types:
- aws_s3_bucket_lifecycle_configuration
definition:
  cond_type: attribute
  attribute: rule.abort_incomplete_multipart_upload
  operator: exists
fixtures:
  fail: "resource \"aws_s3_bucket_lifecycle_configuration\" \"bad\" {\n  bucket = \"b\"\n  rule {\n    id = \"r\"\n    status\
    \ = \"Enabled\"\n  }\n}\n"
  pass: "resource \"aws_s3_bucket_lifecycle_configuration\" \"good\" {\n  bucket = \"b\"\n  rule {\n    id = \"r\"\n    status\
    \ = \"Enabled\"\n    abort_incomplete_multipart_upload {\n      days_after_initiation = 7\n    }\n  }\n}\n"
