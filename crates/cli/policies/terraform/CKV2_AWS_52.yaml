metadata:
  id: CKV2_AWS_52
  name: Ensure Elasticsearch domain has advanced security options
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV2_AWS_52. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticsearch_domain
- aws_opensearch_domain
definition:
  or:
  - cond_type: attribute
    attribute: advanced_security_options.enabled
    operator: equals
    value: true
  - cond_type: attribute
    attribute: advanced_security_options.internal_user_database_enabled
    operator: equals
    value: true
fixtures:
  fail: "resource \"aws_elasticsearch_domain\" \"bad\" {\n  domain_name = \"es\"\n}\n"
  pass: "resource \"aws_elasticsearch_domain\" \"good\" {\n  domain_name = \"es\"\n  advanced_security_options {\n    enabled\
    \ = true\n  }\n}\n"
