metadata:
  id: CKV_AWS_368
  name: Ensure Amazon Sagemaker Data Quality Job uses KMS to encrypt data on attached storage volume
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_368. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sagemaker_data_quality_job_definition
definition:
  cond_type: attribute
  attribute: job_resources.cluster_config.volume_kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_sagemaker_data_quality_job_definition" "bad" {
    }
  pass: |
    resource "aws_sagemaker_data_quality_job_definition" "good" {
      job_resources {
        cluster_config {
          volume_kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
        }
      }
    }
