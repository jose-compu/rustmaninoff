metadata:
  id: CKV_AWS_311
  name: Ensure that CodeBuild S3 logs are encrypted
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_311. https://github.com/bridgecrewio/checkov
resource_types:
- aws_codebuild_project
definition:
  or:
  - cond_type: attribute
    attribute: logs_config.s3_logs.encryption_disabled
    operator: not_exists
  - cond_type: attribute
    attribute: logs_config.s3_logs.encryption_disabled
    operator: is_false
fixtures:
  fail: |
    resource "aws_codebuild_project" "bad" {
      logs_config {
        s3_logs {
          encryption_disabled = true
        }
      }
    }
  pass: |
    resource "aws_codebuild_project" "good" {
      logs_config {
        s3_logs {
          encryption_disabled = false
        }
      }
    }
