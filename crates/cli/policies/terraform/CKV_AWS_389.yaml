metadata:
  id: CKV_AWS_389
  name: Ensure AWS Auto Scaling group launch configuration doesn't have public IP address assignment enabled
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_389. https://github.com/bridgecrewio/checkov
resource_types:
- aws_launch_configuration
definition:
  or:
  - cond_type: attribute
    attribute: associate_public_ip_address
    operator: not_exists
  - cond_type: attribute
    attribute: associate_public_ip_address
    operator: is_false
fixtures:
  fail: |
    resource "aws_launch_configuration" "bad" {
      associate_public_ip_address = true
    }
  pass: |
    resource "aws_launch_configuration" "good" {
      associate_public_ip_address = false
    }
