metadata:
  id: CKV_AWS_215
  name: Ensure AppSync API Cache is encrypted in transit
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_215. https://github.com/bridgecrewio/checkov
resource_types:
- aws_appsync_api_cache
definition:
  cond_type: attribute
  attribute: transit_encryption_enabled
  operator: is_true
fixtures:
  fail: |
    resource "aws_appsync_api_cache" "bad" {
      transit_encryption_enabled = false
    }
  pass: |
    resource "aws_appsync_api_cache" "good" {
      transit_encryption_enabled = true
    }
