metadata:
  id: CKV_AWS_27
  name: Ensure all data stored in the SQS queue is encrypted
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_27. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sqs_queue
definition:
  or:
  - cond_type: attribute
    attribute: sqs_managed_sse_enabled
    operator: is_true
  - cond_type: attribute
    attribute: kms_master_key_id
    operator: exists
fixtures:
  fail: "resource \"aws_sqs_queue\" \"bad\" {\n  name = \"plain\"\n}\n"
  pass: "resource \"aws_sqs_queue\" \"sse\" {\n  sqs_managed_sse_enabled = true\n}\nresource \"aws_sqs_queue\" \"kms\" {\n  kms_master_key_id = \"alias/aws/sqs\"\n}\n"