metadata:
  id: CKV_AWS_193
  name: Ensure AppSync has Logging enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_193. https://github.com/bridgecrewio/checkov
resource_types:
- aws_appsync_graphql_api
definition:
  cond_type: attribute
  attribute: log_config.cloudwatch_logs_role_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_appsync_graphql_api" "bad" {
    }
  pass: |
    resource "aws_appsync_graphql_api" "good" {
      log_config {
        cloudwatch_logs_role_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      }
    }
