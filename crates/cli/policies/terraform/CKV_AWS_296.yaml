metadata:
  id: CKV_AWS_296
  name: Ensure DMS endpoint uses Customer Managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_296. https://github.com/bridgecrewio/checkov
resource_types:
- aws_dms_endpoint
definition:
  or:
  - cond_type: attribute
    attribute: kms_key_arn
    operator: exists
  - cond_type: attribute
    attribute: s3_settings.server_side_encryption_kms_key_id
    operator: exists
fixtures:
  fail: |
    resource "aws_dms_endpoint" "bad" {
      engine_name = "mysql"
    }
  pass: |
    resource "aws_dms_endpoint" "good" {
      engine_name = "mysql"
      kms_key_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
