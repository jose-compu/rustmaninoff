metadata:
  id: CKV_AWS_231
  name: Ensure no NACL allow ingress from 0.0.0.0:0 to port 3389
  category: NETWORKING
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_231. https://github.com/bridgecrewio/checkov
resource_types:
- aws_network_acl
- aws_network_acl_rule
definition:
  cond_type: no_element
  attribute: ingress
  where:
    and:
    - cond_type: attribute
      attribute: from_port
      operator: less_than_or_equal
      value: 3389
    - cond_type: attribute
      attribute: to_port
      operator: greater_than_or_equal
      value: 3389
    - cond_type: attribute
      attribute: cidr_block
      operator: equals
      value: 0.0.0.0/0
fixtures:
  fail: |
    resource "aws_network_acl" "bad" {
      ingress {
        protocol   = "tcp"
        rule_no    = 100
        action     = "allow"
        cidr_block = "0.0.0.0/0"
        from_port  = 3389
        to_port    = 3389
      }
    }
  pass: |
    resource "aws_network_acl" "good" {
      ingress {
        protocol   = "tcp"
        rule_no    = 100
        action     = "allow"
        cidr_block = "10.0.0.0/8"
        from_port  = 3389
        to_port    = 3389
      }
    }
