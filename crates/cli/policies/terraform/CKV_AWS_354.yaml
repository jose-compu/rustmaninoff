metadata:
  id: CKV_AWS_354
  name: Ensure RDS Performance Insights are encrypted using KMS CMKs
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_354. https://github.com/bridgecrewio/checkov
resource_types:
- aws_rds_cluster_instance
- aws_db_instance
definition:
  cond_type: attribute
  attribute: performance_insights_kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_db_instance" "bad" {
      performance_insights_enabled = true
    }
  pass: |
    resource "aws_db_instance" "good" {
      performance_insights_enabled  = true
      performance_insights_kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
