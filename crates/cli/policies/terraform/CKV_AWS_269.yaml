metadata:
  id: CKV_AWS_269
  name: Ensure Connect Instance Kinesis Video Stream Storage Config uses CMK
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_269. https://github.com/bridgecrewio/checkov
resource_types:
- aws_connect_instance_storage_config
definition:
  cond_type: attribute
  attribute: storage_config.kinesis_video_stream_config.encryption_config.key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_connect_instance_storage_config" "bad" {
    }
  pass: |
    resource "aws_connect_instance_storage_config" "good" {
      storage_config {
        kinesis_video_stream_config {
          encryption_config {
            key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
          }
        }
      }
    }
