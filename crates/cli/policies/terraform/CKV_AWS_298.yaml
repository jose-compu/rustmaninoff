metadata:
  id: CKV_AWS_298
  name: Ensure DMS S3 uses Customer Managed Key (CMK)
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_298. https://github.com/bridgecrewio/checkov
resource_types:
- aws_dms_s3_endpoint
definition:
  cond_type: attribute
  attribute: kms_key_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_dms_s3_endpoint" "bad" {
    }
  pass: |
    resource "aws_dms_s3_endpoint" "good" {
      kms_key_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
