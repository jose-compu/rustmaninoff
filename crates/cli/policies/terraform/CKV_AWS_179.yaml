metadata:
  id: CKV_AWS_179
  name: Ensure FSX Windows filesystem is encrypted by KMS using a customer managed Key (CMK)
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_179. https://github.com/bridgecrewio/checkov
resource_types:
- aws_fsx_windows_file_system
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_fsx_windows_file_system" "bad" {
      storage_capacity = 300
      subnet_ids = ["subnet-1"]
      throughput_capacity = 32
    }
  pass: |
    resource "aws_fsx_windows_file_system" "good" {
      storage_capacity = 300
      subnet_ids = ["subnet-1"]
      throughput_capacity = 32
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
