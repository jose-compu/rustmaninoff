metadata:
  id: CKV_AWS_181
  name: Ensure S3 Object Copy is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_181. https://github.com/bridgecrewio/checkov
resource_types:
- aws_s3_object_copy
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_s3_object_copy" "bad" {
    }
  pass: |
    resource "aws_s3_object_copy" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
