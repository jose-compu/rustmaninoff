metadata:
  id: CKV_AWS_205
  name: Ensure to Limit AMI launch Permissions
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_205. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ami_launch_permission
definition:
  cond_type: forbid_resource
fixtures:
  fail: |
    resource "aws_ami_launch_permission" "bad" {
      account_id = "123456789012"
    }
  pass: |
    resource "aws_vpc" "good" {
      cidr_block = "10.0.0.0/16"
    }
