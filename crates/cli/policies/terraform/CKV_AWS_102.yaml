metadata:
  id: CKV_AWS_102
  name: Ensure Neptune Cluster instance is not publicly available
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_102. https://github.com/bridgecrewio/checkov
resource_types:
- aws_neptune_cluster_instance
definition:
  or:
  - cond_type: attribute
    attribute: publicly_accessible
    operator: not_exists
  - cond_type: attribute
    attribute: publicly_accessible
    operator: is_false
fixtures:
  fail: |
    resource "aws_neptune_cluster_instance" "bad" {
      cluster_identifier  = "neptune"
      instance_class      = "db.r5.large"
      publicly_accessible = true
    }
  pass: |
    resource "aws_neptune_cluster_instance" "good" {
      cluster_identifier  = "neptune"
      instance_class      = "db.r5.large"
      publicly_accessible = false
    }
