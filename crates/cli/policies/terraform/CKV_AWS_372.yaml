metadata:
  id: CKV_AWS_372
  name: Ensure Amazon SageMaker Flow Definition uses KMS for output configurations
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_372. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sagemaker_flow_definition
definition:
  cond_type: attribute
  attribute: output_config.kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_sagemaker_flow_definition" "bad" {
    }
  pass: |
    resource "aws_sagemaker_flow_definition" "good" {
      output_config {
        kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      }
    }
