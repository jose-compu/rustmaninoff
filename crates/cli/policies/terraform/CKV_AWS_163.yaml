metadata:
  id: CKV_AWS_163
  name: Ensure ECR image scanning on push is enabled
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_163. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ecr_repository
definition:
  cond_type: attribute
  attribute: image_scanning_configuration.scan_on_push
  operator: equals
  value: true
fixtures:
  fail: |
    resource "aws_ecr_repository" "bad" {
      name = "app"
    }
  pass: |
    resource "aws_ecr_repository" "good" {
      name = "app"
      image_scanning_configuration {
        scan_on_push = true
      }
    }
