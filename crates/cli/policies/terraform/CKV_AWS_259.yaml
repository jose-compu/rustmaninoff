metadata:
  id: CKV_AWS_259
  name: Ensure CloudFront response header policy enforces Strict Transport Security
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_259. https://github.com/bridgecrewio/checkov
resource_types:
- aws_cloudfront_response_headers_policy
definition:
  and:
  - cond_type: attribute
    attribute: security_headers_config.strict_transport_security.access_control_max_age_sec
    operator: greater_than_or_equal
    value: 31536000
  - cond_type: attribute
    attribute: security_headers_config.strict_transport_security.override
    operator: equals
    value: true
fixtures:
  fail: |
    resource "aws_cloudfront_response_headers_policy" "bad" {
      name = "bad"
    }
  pass: |
    resource "aws_cloudfront_response_headers_policy" "good" {
      name = "good"
      security_headers_config {
        strict_transport_security {
          access_control_max_age_sec = 31536000
          override                   = true
        }
      }
    }
