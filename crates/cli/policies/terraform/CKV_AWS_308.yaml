metadata:
  id: CKV_AWS_308
  name: Ensure API Gateway method setting caching is encrypted
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_308. https://github.com/bridgecrewio/checkov
resource_types:
- aws_api_gateway_method_settings
definition:
  cond_type: attribute
  attribute: settings.cache_data_encrypted
  operator: is_true
fixtures:
  fail: |
    resource "aws_api_gateway_method_settings" "bad" {
      settings {
        cache_data_encrypted = false
      }
    }
  pass: |
    resource "aws_api_gateway_method_settings" "good" {
      settings {
        cache_data_encrypted = true
      }
    }
