metadata:
  id: CKV_AWS_191
  name: Ensure ElastiCache replication group is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_191. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticache_replication_group
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_elasticache_replication_group" "bad" {
    }
  pass: |
    resource "aws_elasticache_replication_group" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
