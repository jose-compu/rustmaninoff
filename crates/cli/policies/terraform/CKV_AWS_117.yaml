metadata:
  id: CKV_AWS_117
  name: Ensure that AWS Lambda function is configured inside a VPC
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_117. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lambda_function
definition:
  cond_type: attribute
  attribute: vpc_config
  operator: exists
fixtures:
  fail: |
    resource "aws_lambda_function" "bad" {
      function_name = "fn"
      role          = "arn:aws:iam::123456789012:role/lambda"
      handler       = "index.handler"
      runtime       = "python3.12"
      filename      = "fn.zip"
    }
  pass: |
    resource "aws_lambda_function" "good" {
      function_name = "fn"
      role          = "arn:aws:iam::123456789012:role/lambda"
      handler       = "index.handler"
      runtime       = "python3.12"
      filename      = "fn.zip"
      vpc_config {
        subnet_ids         = ["subnet-1"]
        security_group_ids = ["sg-1"]
      }
    }
