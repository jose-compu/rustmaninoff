metadata:
  id: CKV_AWS_4
  name: Ensure the CloudWatch Log Group is encrypted by a KMS key
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_4. https://github.com/bridgecrewio/checkov
resource_types:
- aws_cloudwatch_log_group
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_cloudwatch_log_group" "bad" {
      name = "app"
    }
  pass: |
    resource "aws_cloudwatch_log_group" "good" {
      name       = "app"
      kms_key_id = "arn:aws:kms:us-east-1:123:key/abc"
    }
