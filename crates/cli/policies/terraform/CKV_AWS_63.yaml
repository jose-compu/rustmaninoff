metadata:
  id: CKV_AWS_63
  name: Ensure no IAM policies documents allow "*" as a statement's actions
  category: IAM
  severity: CRITICAL
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_63. https://github.com/bridgecrewio/checkov
resource_types:
- aws_iam_policy
- aws_iam_role_policy
- aws_iam_user_policy
- aws_iam_group_policy
definition:
  cond_type: no_element
  attribute: policy.Statement
  where:
    and:
    - cond_type: attribute
      attribute: Effect
      operator: equals
      value: Allow
    - or:
      - cond_type: attribute
        attribute: Action
        operator: equals_any
        value: '*'
      - cond_type: attribute
        attribute: Action
        operator: equals_any
        value: '*:*'
fixtures:
  fail: "resource \"aws_iam_policy\" \"bad\" {\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [{\n\
    \      Effect   = \"Allow\"\n      Action   = \"*\"\n      Resource = \"arn:aws:s3:::bucket\"\n    }]\n  })\n}\n"
  pass: "resource \"aws_iam_policy\" \"good\" {\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [{\n\
    \      Effect   = \"Allow\"\n      Action   = \"s3:GetObject\"\n      Resource = \"arn:aws:s3:::bucket/*\"\n    }]\n \
    \ })\n}\n"
