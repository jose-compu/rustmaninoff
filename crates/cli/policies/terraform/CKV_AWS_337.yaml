metadata:
  id: CKV_AWS_337
  name: Ensure SSM parameters are using KMS CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_337. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ssm_parameter
definition:
  cond_type: attribute
  attribute: key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_ssm_parameter" "bad" {
    }
  pass: |
    resource "aws_ssm_parameter" "good" {
      key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
