metadata:
  id: CKV_AWS_134
  name: Ensure that Amazon ElastiCache Redis clusters have automatic backup turned on
  category: BACKUP_AND_RECOVERY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_134. Memcached is skipped via engine equals. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticache_cluster
definition:
  or:
  - cond_type: attribute
    attribute: engine
    operator: equals
    value: memcached
  - and:
    - cond_type: attribute
      attribute: snapshot_retention_limit
      operator: exists
    - cond_type: attribute
      attribute: snapshot_retention_limit
      operator: greater_than
      value: 0
fixtures:
  fail: |
    resource "aws_elasticache_cluster" "bad" {
      cluster_id = "redis"
      engine     = "redis"
      node_type  = "cache.t3.micro"
    }
  pass: |
    resource "aws_elasticache_cluster" "good" {
      cluster_id               = "redis"
      engine                   = "redis"
      node_type                = "cache.t3.micro"
      snapshot_retention_limit = 5
    }
