  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_201. https://github.com/bridgecrewio/checkov
resource_types:
- aws_memorydb_cluster
definition:
  cond_type: attribute
  attribute: kms_key_arn
  operator: exists
