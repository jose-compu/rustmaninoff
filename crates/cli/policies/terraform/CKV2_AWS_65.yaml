metadata:
  id: CKV2_AWS_65
  name: Ensure S3 bucket ownership controls enforce BucketOwnerEnforced
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV2_AWS_65. https://github.com/bridgecrewio/checkov
resource_types:
- aws_s3_bucket_ownership_controls
definition:
  cond_type: attribute
  attribute: rule.object_ownership
  operator: equals
  value: BucketOwnerEnforced
fixtures:
  fail: "resource \"aws_s3_bucket_ownership_controls\" \"bad\" {\n  bucket = \"b\"\n  rule {\n    object_ownership = \"ObjectWriter\"\
    \n  }\n}\n"
  pass: "resource \"aws_s3_bucket_ownership_controls\" \"good\" {\n  bucket = \"b\"\n  rule {\n    object_ownership = \"BucketOwnerEnforced\"\
    \n  }\n}\n"
