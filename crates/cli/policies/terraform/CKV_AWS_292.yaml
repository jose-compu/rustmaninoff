metadata:
  id: CKV_AWS_292
  name: Ensure DocumentDB Global Cluster is encrypted at rest (default is unencrypted)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_292. https://github.com/bridgecrewio/checkov
resource_types:
- aws_docdb_global_cluster
definition:
  cond_type: attribute
  attribute: storage_encrypted
  operator: is_true
fixtures:
  fail: |
    resource "aws_docdb_global_cluster" "bad" {
      storage_encrypted = false
    }
  pass: |
    resource "aws_docdb_global_cluster" "good" {
      storage_encrypted = true
    }
