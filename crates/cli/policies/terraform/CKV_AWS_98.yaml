metadata:
  id: CKV_AWS_98
  name: Ensure all data stored in the Sagemaker Endpoint is securely encrypted at rest
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_98. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sagemaker_endpoint_configuration
definition:
  cond_type: attribute
  attribute: kms_key_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_sagemaker_endpoint_configuration" "bad" {
      name = "ep"
      production_variants {
        variant_name           = "v1"
        model_name             = "model"
        initial_instance_count = 1
        instance_type          = "ml.t2.medium"
      }
    }
  pass: |
    resource "aws_sagemaker_endpoint_configuration" "good" {
      name         = "ep"
      kms_key_arn  = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      production_variants {
        variant_name           = "v1"
        model_name             = "model"
        initial_instance_count = 1
        instance_type          = "ml.t2.medium"
      }
    }
