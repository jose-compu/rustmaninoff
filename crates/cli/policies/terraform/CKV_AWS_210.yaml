metadata:
  id: CKV_AWS_210
  name: Batch job does not define a privileged container
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_210. https://github.com/bridgecrewio/checkov
resource_types:
- aws_batch_job_definition
definition:
  or:
  - cond_type: attribute
    attribute: container_properties.privileged
    operator: not_exists
  - cond_type: attribute
    attribute: container_properties.privileged
    operator: equals
    value: false
fixtures:
  fail: |
    resource "aws_batch_job_definition" "bad" {
      name = "bad"
      type = "container"
      container_properties = {
        image = "busybox"
        privileged = true
      }
    }
  pass: |
    resource "aws_batch_job_definition" "good" {
      name = "good"
      type = "container"
      container_properties = {
        image = "busybox"
      }
    }
