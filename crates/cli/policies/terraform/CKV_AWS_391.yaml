metadata:
  id: CKV_AWS_391
  name: Avoid AWS Redshift cluster with commonly used master username and public access setting enabled
  category: NETWORKING
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_391. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshift_cluster
definition:
  or:
  - cond_type: attribute
    attribute: master_username
    operator: not_within
    value:
    - awsuser
    - administrator
    - admin
  - and:
    - cond_type: attribute
      attribute: publicly_accessible
      operator: exists
    - cond_type: attribute
      attribute: publicly_accessible
      operator: is_false
fixtures:
  fail: |
    resource "aws_redshift_cluster" "bad" {
      master_username     = "awsuser"
      publicly_accessible = true
    }
  pass: |
    resource "aws_redshift_cluster" "good" {
      master_username     = "appuser"
      publicly_accessible = true
    }
