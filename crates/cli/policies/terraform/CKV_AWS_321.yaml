metadata:
  id: CKV_AWS_321
  name: Ensure Redshift clusters use enhanced VPC routing
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_321. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshift_cluster
definition:
  cond_type: attribute
  attribute: enhanced_vpc_routing
  operator: is_true
fixtures:
  fail: |
    resource "aws_redshift_cluster" "bad" {
      enhanced_vpc_routing = false
    }
  pass: |
    resource "aws_redshift_cluster" "good" {
      enhanced_vpc_routing = true
    }
