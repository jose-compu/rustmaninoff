metadata:
  id: CKV_AWS_352
  name: Ensure NACL ingress does not allow all Ports
  category: NETWORKING
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_352. https://github.com/bridgecrewio/checkov
resource_types:
- aws_network_acl_rule
definition:
  or:
  - cond_type: attribute
    attribute: egress
    operator: is_true
  - cond_type: attribute
    attribute: from_port
    operator: exists
fixtures:
  fail: |
    resource "aws_network_acl_rule" "bad" {
      protocol   = "-1"
      rule_action = "allow"
      cidr_block = "0.0.0.0/0"
    }
  pass: |
    resource "aws_network_acl_rule" "good" {
      from_port  = 443
      to_port    = 443
      protocol   = "tcp"
      rule_action = "allow"
      cidr_block = "10.0.0.0/8"
    }
