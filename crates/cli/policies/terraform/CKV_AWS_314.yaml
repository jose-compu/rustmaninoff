metadata:
  id: CKV_AWS_314
  name: Ensure that CodeBuild projects have logging enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_314. https://github.com/bridgecrewio/checkov
resource_types:
- aws_codebuild_project
definition:
  or:
  - cond_type: attribute
    attribute: logs_config.cloudwatch_logs.status
    operator: equals
    value: ENABLED
  - cond_type: attribute
    attribute: logs_config.s3_logs.status
    operator: equals
    value: ENABLED
fixtures:
  fail: |
    resource "aws_codebuild_project" "bad" {
      name = "build"
    }
  pass: |
    resource "aws_codebuild_project" "good" {
      name = "build"
      logs_config {
        cloudwatch_logs {
          status = "ENABLED"
        }
      }
    }
