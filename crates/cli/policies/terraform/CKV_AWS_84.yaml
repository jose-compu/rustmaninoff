metadata:
  id: CKV_AWS_84
  name: Ensure Elasticsearch Domain Logging is enabled
  category: LOGGING
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_84. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticsearch_domain
- aws_opensearch_domain
definition:
  and:
  - cond_type: attribute
    attribute: log_publishing_options.cloudwatch_log_group_arn
    operator: exists
  - or:
    - cond_type: attribute
      attribute: log_publishing_options.enabled
      operator: not_exists
    - cond_type: attribute
      attribute: log_publishing_options.enabled
      operator: is_true
fixtures:
  fail: |
    resource "aws_elasticsearch_domain" "bad" {
      domain_name = "es"
    }
  pass: |
    resource "aws_elasticsearch_domain" "good" {
      domain_name = "es"
      log_publishing_options {
        cloudwatch_log_group_arn = "arn:aws:logs:us-east-1:123456789012:log-group:es"
        log_type                 = "INDEX_SLOW_LOGS"
      }
    }
