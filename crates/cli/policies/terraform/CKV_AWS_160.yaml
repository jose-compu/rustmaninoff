metadata:
  id: CKV_AWS_160
  name: Ensure that Timestream database is encrypted with KMS CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_160. https://github.com/bridgecrewio/checkov
resource_types:
- aws_timestreamwrite_database
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_timestreamwrite_database" "bad" {
    }
  pass: |
    resource "aws_timestreamwrite_database" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
