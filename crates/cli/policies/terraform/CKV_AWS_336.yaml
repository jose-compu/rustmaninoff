metadata:
  id: CKV_AWS_336
  name: Ensure ECS containers are limited to read-only access to root filesystems
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_336. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ecs_task_definition
definition:
  cond_type: attribute
  attribute: container_definitions.readonlyRootFilesystem
  operator: equals
  value: true
fixtures:
  fail: |
    resource "aws_ecs_task_definition" "bad" {
      family = "app"
      container_definitions = [{ name = "app", image = "app:1" }]
    }
  pass: |
    resource "aws_ecs_task_definition" "good" {
      family = "app"
      container_definitions = [{
        name                  = "app"
        image                 = "app:1"
        readonlyRootFilesystem = true
      }]
    }
