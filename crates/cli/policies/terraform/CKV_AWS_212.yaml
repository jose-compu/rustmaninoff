metadata:
  id: CKV_AWS_212
  name: Ensure DMS replication instance is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_212. https://github.com/bridgecrewio/checkov
resource_types:
- aws_dms_replication_instance
definition:
  cond_type: attribute
  attribute: kms_key_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_dms_replication_instance" "bad" {
    }
  pass: |
    resource "aws_dms_replication_instance" "good" {
      kms_key_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
