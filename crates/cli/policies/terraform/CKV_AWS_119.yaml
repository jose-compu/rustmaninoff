metadata:
  id: CKV_AWS_119
  name: Ensure DynamoDB Tables are encrypted using a KMS Customer Managed CMK
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_119. https://github.com/bridgecrewio/checkov
resource_types:
- aws_dynamodb_table
definition:
  and:
  - cond_type: attribute
    attribute: server_side_encryption.enabled
    operator: equals
    value: true
  - cond_type: attribute
    attribute: server_side_encryption.kms_key_arn
    operator: exists
fixtures:
  fail: "resource \"aws_dynamodb_table\" \"bad\" {\n  name = \"items\"\n  hash_key = \"id\"\n}\n"
  pass: "resource \"aws_dynamodb_table\" \"good\" {\n  name = \"items\"\n  server_side_encryption {\n    enabled     = true\n\
    \    kms_key_arn = \"arn:aws:kms:us-east-1:123:key/abc\"\n  }\n}\n"
