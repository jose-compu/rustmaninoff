metadata:
  id: CKV_AWS_197
  name: Ensure MQ Broker Audit logging is enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_197. https://github.com/bridgecrewio/checkov
resource_types:
- aws_mq_broker
definition:
  cond_type: attribute
  attribute: logs.audit
  operator: is_true
fixtures:
  fail: |
    resource "aws_mq_broker" "bad" {
      logs {
        audit = false
      }
    }
  pass: |
    resource "aws_mq_broker" "good" {
      logs {
        audit = true
      }
    }
