  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_271. https://github.com/bridgecrewio/checkov
resource_types:
- aws_dynamodb_table_replica
definition:
  cond_type: attribute
  attribute: kms_key_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_dynamodb_table_replica" "bad" {
    }
  pass: |
    resource "aws_dynamodb_table_replica" "good" {
