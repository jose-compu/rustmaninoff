    \ = \"tcp\"\n  security_group_id = \"sg-123\"\n}\n"
  pass: "resource \"aws_security_group_rule\" \"good\" {\n  description = \"https\"\n  type = \"ingress\"\n  from_port = 443\n\
    \  to_port = 443\n  protocol = \"tcp\"\n  security_group_id = \"sg-123\"\n}\n"
