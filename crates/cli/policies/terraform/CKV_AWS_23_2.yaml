  name: Ensure every security group rule has a description
  category: NETWORKING
  severity: LOW
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_23. https://github.com/bridgecrewio/checkov
resource_types:
- aws_security_group_rule
definition:
