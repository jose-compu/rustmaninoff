metadata:
  id: CKV_AWS_199
  name: Ensure Image Builder Distribution Configuration encrypts AMI's 
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_199. https://github.com/bridgecrewio/checkov
resource_types:
- aws_imagebuilder_distribution_configuration
definition:
  cond_type: attribute
  attribute: distribution.ami_distribution_configuration.kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_imagebuilder_distribution_configuration" "bad" {
    }
  pass: |
    resource "aws_imagebuilder_distribution_configuration" "good" {
      distribution {
        ami_distribution_configuration {
          kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
        }
      }
    }
