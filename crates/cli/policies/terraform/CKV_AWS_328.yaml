metadata:
  id: CKV_AWS_328
  name: Ensure that ALB is configured with defensive or strictest desync mitigation mode
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_328. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lb
- aws_alb
- aws_elb
definition:
  or:
  - cond_type: attribute
    attribute: desync_mitigation_mode
    operator: not_exists
  - cond_type: attribute
    attribute: desync_mitigation_mode
    operator: not_equals
    value: "monitor"
fixtures:
  fail: |
    resource "aws_lb" "bad" {
      desync_mitigation_mode = "monitor"
    }
  pass: |
    resource "aws_lb" "good" {
      desync_mitigation_mode = "GOOD"
    }
