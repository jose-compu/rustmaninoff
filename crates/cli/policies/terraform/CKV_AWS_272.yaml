metadata:
  id: CKV_AWS_272
  name: Ensure AWS Lambda function is configured to validate code-signing
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_272. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lambda_function
definition:
  cond_type: attribute
  attribute: code_signing_config_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_lambda_function" "bad" {
    }
  pass: |
    resource "aws_lambda_function" "good" {
      code_signing_config_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
