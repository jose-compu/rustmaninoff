metadata:
  id: CKV_AWS_142
  name: Ensure that Redshift cluster is encrypted by KMS
  category: ENCRYPTION
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_142. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshift_cluster
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_redshift_cluster" "bad" {
      cluster_identifier = "rs"
      node_type = "dc2.large"
    }
  pass: |
    resource "aws_redshift_cluster" "good" {
      cluster_identifier = "rs"
      node_type = "dc2.large"
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
