metadata:
  id: CKV_AWS_236
  name: Ensure AMI copying uses a CMK
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_236. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ami_copy
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_ami_copy" "bad" {
    }
  pass: |
    resource "aws_ami_copy" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
