metadata:
  id: CKV_AWS_85
  name: Ensure DocumentDB Logging is enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_85. https://github.com/bridgecrewio/checkov
resource_types:
- aws_docdb_cluster
definition:
  or:
  - cond_type: attribute
    attribute: enabled_cloudwatch_logs_exports
    operator: contains
    value: audit
  - cond_type: attribute
    attribute: enabled_cloudwatch_logs_exports
    operator: contains
    value: profiler
fixtures:
  fail: |
    resource "aws_docdb_cluster" "bad" {
    }
  pass: |
    resource "aws_docdb_cluster" "good" {
      enabled_cloudwatch_logs_exports = ["audit"]
    }
