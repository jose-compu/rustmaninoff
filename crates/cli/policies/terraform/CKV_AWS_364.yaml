metadata:
  id: CKV_AWS_364
  name: Ensure that AWS Lambda function permissions delegated to AWS services are limited by SourceArn or SourceAccount
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_364. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lambda_permission
definition:
  or:
  - cond_type: attribute
    attribute: principal
    operator: not_contains
    value: amazonaws.com
  - or:
    - cond_type: attribute
      attribute: source_arn
      operator: exists
    - cond_type: attribute
      attribute: source_account
      operator: exists
fixtures:
  fail: |
    resource "aws_lambda_permission" "bad" {
      principal = "s3.amazonaws.com"
      action    = "lambda:InvokeFunction"
    }
  pass: |
    resource "aws_lambda_permission" "good" {
      principal     = "s3.amazonaws.com"
      action        = "lambda:InvokeFunction"
      source_arn    = "arn:aws:s3:::bucket"
    }
