metadata:
  id: CKV_AWS_340
  name: Ensure Elastic Beanstalk managed platform updates are enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_340. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elastic_beanstalk_environment
definition:
  and:
  - cond_type: attribute
    attribute: setting.namespace
    operator: equals
    value: "aws:elasticbeanstalk:managedactions"
  - cond_type: attribute
    attribute: setting.name
    operator: equals
    value: ManagedActionsEnabled
  - cond_type: attribute
    attribute: setting.value
    operator: equals
    value: "True"
fixtures:
  fail: |
    resource "aws_elastic_beanstalk_environment" "bad" {
      name = "env"
    }
  pass: |
    resource "aws_elastic_beanstalk_environment" "good" {
      name = "env"
      setting {
        namespace = "aws:elasticbeanstalk:managedactions"
        name      = "ManagedActionsEnabled"
        value     = "True"
      }
    }
