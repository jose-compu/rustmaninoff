metadata:
  id: CKV_AWS_326
  name: Ensure that RDS Aurora Clusters have backtracking enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_326. https://github.com/bridgecrewio/checkov
resource_types:
- aws_rds_cluster
definition:
  and:
  - cond_type: attribute
    attribute: backtrack_window
    operator: exists
  - cond_type: attribute
    attribute: backtrack_window
    operator: not_equals
    value: 0
fixtures:
  fail: |
    resource "aws_rds_cluster" "bad" {
      engine          = "aurora-mysql"
      backtrack_window = 0
    }
  pass: |
    resource "aws_rds_cluster" "good" {
      engine           = "aurora-mysql"
      backtrack_window = 72
    }
