metadata:
  id: CKV_AWS_280
  name: Ensure Neptune snapshot is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_280. https://github.com/bridgecrewio/checkov
resource_types:
- aws_neptune_cluster_snapshot
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_neptune_cluster_snapshot" "bad" {
    }
  pass: |
    resource "aws_neptune_cluster_snapshot" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
