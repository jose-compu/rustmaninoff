metadata:
  id: CKV_AWS_127
  name: Ensure that Elastic Load Balancer(s) uses SSL certificates provided by AWS Certificate Manager
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_127. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elb
definition:
  or:
  - cond_type: attribute
    attribute: listener
    operator: not_exists
  - cond_type: attribute
    attribute: listener.ssl_certificate_id
    operator: exists
fixtures:
  fail: |
    resource "aws_elb" "bad" {
      listener {
        instance_port     = 80
        instance_protocol = "http"
        lb_port           = 80
        lb_protocol       = "http"
      }
    }
  pass: |
    resource "aws_elb" "good" {
      listener {
        instance_port      = 443
        instance_protocol  = "https"
        lb_port            = 443
        lb_protocol        = "https"
        ssl_certificate_id = "arn:aws:acm:us-east-1:123456789012:certificate/abcd"
      }
    }
