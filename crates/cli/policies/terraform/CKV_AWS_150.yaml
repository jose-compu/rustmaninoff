metadata:
  id: CKV_AWS_150
  name: Ensure that Load Balancer has deletion protection enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_150. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lb
definition:
  cond_type: attribute
  attribute: enable_deletion_protection
  operator: equals
  value: true
fixtures:
  fail: "resource \"aws_lb\" \"bad\" {\n  enable_deletion_protection = false\n}\n"
  pass: "resource \"aws_lb\" \"good\" {\n  enable_deletion_protection = true\n}\n"
