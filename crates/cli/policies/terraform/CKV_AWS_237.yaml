metadata:
  id: CKV_AWS_237
  name: Ensure Create before destroy for API Gateway
  category: BACKUP_AND_RECOVERY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_237. https://github.com/bridgecrewio/checkov
resource_types:
- aws_api_gateway_rest_api
definition:
  cond_type: attribute
  attribute: lifecycle.create_before_destroy
  operator: equals
  value: true
fixtures:
  fail: |
    resource "aws_api_gateway_rest_api" "bad" {
      name = "api"
    }
  pass: |
    resource "aws_api_gateway_rest_api" "good" {
      name = "api"
      lifecycle {
        create_before_destroy = true
      }
    }
