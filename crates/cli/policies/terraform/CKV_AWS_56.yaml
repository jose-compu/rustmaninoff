  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_56. https://github.com/bridgecrewio/checkov
resource_types:
- aws_s3_bucket_public_access_block
definition:
  cond_type: attribute
  attribute: restrict_public_buckets
