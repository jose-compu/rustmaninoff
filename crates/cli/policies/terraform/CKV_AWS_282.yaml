metadata:
  id: CKV_AWS_282
  name: Ensure that Redshift Serverless namespace is encrypted by KMS using a customer managed key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_282. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshiftserverless_namespace
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_redshiftserverless_namespace" "bad" {
    }
  pass: |
    resource "aws_redshiftserverless_namespace" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
