metadata:
  id: CKV_AWS_347
  name: Ensure Neptune is encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_347. https://github.com/bridgecrewio/checkov
resource_types:
- aws_neptune_cluster
definition:
  cond_type: attribute
  attribute: kms_key_arn
  operator: exists
fixtures:
  fail: |
    resource "aws_neptune_cluster" "bad" {
    }
  pass: |
    resource "aws_neptune_cluster" "good" {
      kms_key_arn = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
