metadata:
  id: CKV_AWS_370
  name: Ensure Amazon SageMaker model uses network isolation
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_370. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sagemaker_model
definition:
  cond_type: attribute
  attribute: enable_network_isolation
  operator: is_true
fixtures:
  fail: |
    resource "aws_sagemaker_model" "bad" {
      enable_network_isolation = false
    }
  pass: |
    resource "aws_sagemaker_model" "good" {
      enable_network_isolation = true
    }
