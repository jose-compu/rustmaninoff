metadata:
  id: CKV_AWS_286
  name: Ensure IAM policies do not allow common privilege-escalation actions
  category: IAM
  severity: CRITICAL
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_286. https://github.com/bridgecrewio/checkov
resource_types:
- aws_iam_policy
- aws_iam_role_policy
- aws_iam_user_policy
- aws_iam_group_policy
definition:
  cond_type: no_element
  attribute: policy.Statement
  where:
    and:
    - cond_type: attribute
      attribute: Effect
      operator: equals
      value: Allow
    - cond_type: attribute
      attribute: Action
      operator: intersects
      value:
      - iam:CreatePolicyVersion
      - iam:SetDefaultPolicyVersion
      - iam:PassRole
      - iam:CreateAccessKey
      - iam:CreateLoginProfile
      - iam:UpdateLoginProfile
      - iam:AttachUserPolicy
      - iam:AttachGroupPolicy
      - iam:AttachRolePolicy
      - iam:PutUserPolicy
      - iam:PutGroupPolicy
      - iam:PutRolePolicy
      - iam:AddUserToGroup
      - iam:UpdateAssumeRolePolicy
      - sts:AssumeRole
      - lambda:CreateFunction
      - lambda:UpdateFunctionCode
      - lambda:AddPermission
      - glue:CreateDevEndpoint
      - glue:UpdateDevEndpoint
      - cloudformation:CreateStack
      - datapipeline:CreatePipeline
      - datapipeline:PutPipelineDefinition
fixtures:
  fail: "resource \"aws_iam_policy\" \"bad\" {\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [{\n\
    \      Effect   = \"Allow\"\n      Action   = \"iam:PassRole\"\n      Resource = \"*\"\n    }]\n  })\n}\n"
  pass: "resource \"aws_iam_policy\" \"good\" {\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [{\n\
    \      Effect   = \"Allow\"\n      Action   = \"s3:GetObject\"\n      Resource = \"arn:aws:s3:::bucket/*\"\n    }]\n \
    \ })\n}\n"
