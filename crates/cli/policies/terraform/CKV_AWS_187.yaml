metadata:
  id: CKV_AWS_187
  name: Ensure Sagemaker domain and notebook instance are encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_187. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sagemaker_domain
- aws_sagemaker_notebook_instance
definition:
  cond_type: attribute
  attribute: kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_sagemaker_domain" "bad" {
    }
  pass: |
    resource "aws_sagemaker_domain" "good" {
      kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
    }
