metadata:
  id: CKV_AWS_382
  name: Ensure no security groups allow egress from 0.0.0.0:0 to port -1
  category: NETWORKING
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_382. https://github.com/bridgecrewio/checkov
resource_types:
- aws_security_group
- aws_security_group_rule
- aws_vpc_security_group_egress_rule
definition:
  cond_type: no_element
  attribute: egress
  where:
    and:
    - or:
      - and:
        - cond_type: attribute
          attribute: from_port
          operator: equals
          value: 0
        - cond_type: attribute
          attribute: to_port
          operator: equals
          value: 0
      - cond_type: attribute
        attribute: protocol
        operator: equals
        value: "-1"
    - or:
      - cond_type: attribute
        attribute: cidr_blocks
        operator: contains
        value: 0.0.0.0/0
      - cond_type: attribute
        attribute: ipv6_cidr_blocks
        operator: contains
        value: "::/0"
fixtures:
  fail: |
    resource "aws_security_group" "bad" {
      egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }
  pass: |
    resource "aws_security_group" "good" {
      egress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }
