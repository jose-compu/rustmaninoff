metadata:
  id: CKV_AWS_12
  name: Ensure IAM password policy requires at least one number
  category: IAM
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_12. https://github.com/bridgecrewio/checkov
resource_types:
- aws_iam_account_password_policy
definition:
  cond_type: attribute
  attribute: require_numbers
  operator: equals
  value: true
fixtures:
  fail: "resource \"aws_iam_account_password_policy\" \"bad\" {\n  require_numbers = false\n}\n"
  pass: "resource \"aws_iam_account_password_policy\" \"good\" {\n  require_numbers = true\n}\n"
