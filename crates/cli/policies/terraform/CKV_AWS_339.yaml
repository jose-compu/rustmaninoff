metadata:
  id: CKV_AWS_339
  name: Ensure EKS clusters run on a supported Kubernetes version
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_339. https://github.com/bridgecrewio/checkov
resource_types:
- aws_eks_cluster
definition:
  or:
  - cond_type: attribute
    attribute: version
    operator: not_exists
  - cond_type: attribute
    attribute: version
    operator: within
    value:
    - "1.29"
    - "1.30"
    - "1.31"
    - "1.32"
    - "1.33"
    - "1.34"
    - "1.35"
fixtures:
  fail: |
    resource "aws_eks_cluster" "bad" {
      version = "1.22"
    }
  pass: |
    resource "aws_eks_cluster" "good" {
      version = "1.32"
    }
