metadata:
  id: CKV2_AWS_73
  name: Ensure SQS queue is not encrypted with AWS-managed key alias
  category: ENCRYPTION
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV2_AWS_73. https://github.com/bridgecrewio/checkov
resource_types:
- aws_sqs_queue
definition:
  or:
  - cond_type: attribute
    attribute: kms_master_key_id
    operator: not_exists
  - cond_type: attribute
    attribute: kms_master_key_id
    operator: not_equals
    value: alias/aws/sqs
fixtures:
  fail: "resource \"aws_sqs_queue\" \"bad\" {\n  name = \"bad\"\n  kms_master_key_id = \"alias/aws/sqs\"\n}\n"
  pass: "resource \"aws_sqs_queue\" \"good\" {\n  name = \"good\"\n  kms_master_key_id = \"arn:aws:kms:us-east-1:123:key/abc\"\
    \n}\n"
