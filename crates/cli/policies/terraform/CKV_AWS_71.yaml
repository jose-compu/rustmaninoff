metadata:
  id: CKV_AWS_71
  name: Ensure Redshift Cluster logging is enabled
  category: LOGGING
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_71. https://github.com/bridgecrewio/checkov
resource_types:
- aws_redshift_cluster
definition:
  cond_type: attribute
  attribute: logging.enable
  operator: is_true
fixtures:
  fail: |
    resource "aws_redshift_cluster" "bad" {
      cluster_identifier = "rs"
      node_type          = "dc2.large"
    }
  pass: |
    resource "aws_redshift_cluster" "good" {
      cluster_identifier = "rs"
      node_type          = "dc2.large"
      logging {
        enable        = true
        bucket_name   = "logs"
      }
    }
