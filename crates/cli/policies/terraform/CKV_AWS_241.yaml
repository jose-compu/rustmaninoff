metadata:
  id: CKV_AWS_241
  name: Ensure that Kinesis Firehose Delivery Streams are encrypted with CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_241. https://github.com/bridgecrewio/checkov
resource_types:
- aws_kinesis_firehose_delivery_stream
definition:
  and:
  - cond_type: attribute
    attribute: server_side_encryption.enabled
    operator: is_true
  - cond_type: attribute
    attribute: server_side_encryption.key_type
    operator: equals
    value: CUSTOMER_MANAGED_CMK
  - cond_type: attribute
    attribute: server_side_encryption.key_arn
    operator: exists
fixtures:
  fail: |
    resource "aws_kinesis_firehose_delivery_stream" "bad" {
      name = "stream"
    }
  pass: |
    resource "aws_kinesis_firehose_delivery_stream" "good" {
      name = "stream"
      server_side_encryption {
        enabled  = true
        key_type = "CUSTOMER_MANAGED_CMK"
        key_arn  = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      }
    }
