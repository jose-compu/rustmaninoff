metadata:
  id: CKV_AWS_209
  name: Ensure MQ broker encrypted by KMS using a customer managed Key (CMK)
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_209. https://github.com/bridgecrewio/checkov
resource_types:
- aws_mq_broker
definition:
  cond_type: attribute
  attribute: encryption_options.kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_mq_broker" "bad" {
    }
  pass: |
    resource "aws_mq_broker" "good" {
      encryption_options {
        kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      }
    }
