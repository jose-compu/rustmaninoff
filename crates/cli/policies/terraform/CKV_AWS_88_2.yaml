  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_88. https://github.com/bridgecrewio/checkov
resource_types:
- aws_launch_template
definition:
  cond_type: attribute
  attribute: network_interfaces.associate_public_ip_address
  operator: not_equals
