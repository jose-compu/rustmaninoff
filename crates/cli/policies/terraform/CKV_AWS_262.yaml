metadata:
  id: CKV_AWS_262
  name: Ensure Kendra index Server side encryption uses CMK
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_262. https://github.com/bridgecrewio/checkov
resource_types:
- aws_kendra_index
definition:
  cond_type: attribute
  attribute: server_side_encryption_configuration.kms_key_id
  operator: exists
fixtures:
  fail: |
    resource "aws_kendra_index" "bad" {
    }
  pass: |
    resource "aws_kendra_index" "good" {
      server_side_encryption_configuration {
        kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/abcd"
      }
    }
