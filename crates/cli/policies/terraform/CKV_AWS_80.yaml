metadata:
  id: CKV_AWS_80
  name: Ensure MSK Cluster logging is enabled
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_80. https://github.com/bridgecrewio/checkov
resource_types:
- aws_msk_cluster
definition:
  or:
  - cond_type: attribute
    attribute: logging_info.broker_logs.cloudwatch_logs.enabled
    operator: is_true
  - cond_type: attribute
    attribute: logging_info.broker_logs.firehose.enabled
    operator: is_true
  - cond_type: attribute
    attribute: logging_info.broker_logs.s3.enabled
    operator: is_true
fixtures:
  fail: |
    resource "aws_msk_cluster" "bad" {
      cluster_name = "msk"
    }
  pass: |
    resource "aws_msk_cluster" "good" {
      cluster_name = "msk"
      logging_info {
        broker_logs {
          cloudwatch_logs {
            enabled = true
          }
        }
      }
    }
