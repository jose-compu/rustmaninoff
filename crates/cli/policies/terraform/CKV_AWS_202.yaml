metadata:
  id: CKV_AWS_202
  name: Ensure MemoryDB data is encrypted in transit
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_202. https://github.com/bridgecrewio/checkov
resource_types:
- aws_memorydb_cluster
definition:
  or:
  - cond_type: attribute
    attribute: tls_enabled
    operator: not_exists
  - cond_type: attribute
    attribute: tls_enabled
    operator: is_true
fixtures:
  fail: |
    resource "aws_memorydb_cluster" "bad" {
      tls_enabled = false
    }
  pass: |
    resource "aws_memorydb_cluster" "good" {
      tls_enabled = true
    }
