metadata:
  id: CKV_AWS_317
  name: Ensure Elasticsearch Domain Audit Logging is enabled
  category: LOGGING
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_317. https://github.com/bridgecrewio/checkov
resource_types:
- aws_elasticsearch_domain
- aws_opensearch_domain
definition:
  and:
  - cond_type: attribute
    attribute: log_publishing_options.log_type
    operator: equals_any
    value: AUDIT_LOGS
  - cond_type: attribute
    attribute: log_publishing_options.enabled
    operator: equals
    value: true
fixtures:
  fail: |
    resource "aws_elasticsearch_domain" "bad" {
      domain_name = "es"
    }
  pass: |
    resource "aws_elasticsearch_domain" "good" {
      domain_name = "es"
      log_publishing_options {
        log_type = "AUDIT_LOGS"
        enabled  = true
      }
    }
