metadata:
  id: CKV_AWS_65
  name: Ensure container insights are enabled on ECS cluster
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_65. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ecs_cluster
definition:
  and:
  - cond_type: attribute
    attribute: setting.name
    operator: equals
    value: containerInsights
  - cond_type: attribute
    attribute: setting.value
    operator: within
    value:
    - enabled
    - enhanced
fixtures:
  fail: |
    resource "aws_ecs_cluster" "bad" {
      name = "app"
    }
  pass: |
    resource "aws_ecs_cluster" "good" {
      name = "app"
      setting {
        name  = "containerInsights"
        value = "enabled"
      }
    }
