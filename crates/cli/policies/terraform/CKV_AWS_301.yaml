metadata:
  id: CKV_AWS_301
  name: Ensure that AWS Lambda function is not publicly accessible
  category: GENERAL_SECURITY
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_301. https://github.com/bridgecrewio/checkov
resource_types:
- aws_lambda_permission
definition:
  or:
  - cond_type: attribute
    attribute: principal
    operator: not_exists
  - cond_type: attribute
    attribute: principal
    operator: not_equals
    value: "*"
fixtures:
  fail: |
    resource "aws_lambda_permission" "bad" {
      principal = "*"
    }
  pass: |
    resource "aws_lambda_permission" "good" {
      principal = "GOOD"
    }
