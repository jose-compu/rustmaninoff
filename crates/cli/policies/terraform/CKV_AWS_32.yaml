metadata:
  id: CKV_AWS_32
  name: Ensure ECR policy is not set to public
  category: IAM
  severity: HIGH
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_32. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ecr_repository_policy
definition:
  cond_type: no_element
  attribute: policy.Statement
  where:
    and:
    - cond_type: attribute
      attribute: Effect
      operator: equals
      value: Allow
    - or:
      - cond_type: attribute
        attribute: Principal
        operator: equals_any
        value: '*'
      - cond_type: attribute
        attribute: Principal.AWS
        operator: equals_any
        value: '*'
fixtures:
  fail: "resource \"aws_ecr_repository_policy\" \"bad\" {\n  policy = jsonencode({ Statement = [{ Effect = \"Allow\", Principal\
    \ = \"*\", Action = \"*\", Resource = \"*\" }] })\n}\n"
  pass: "resource \"aws_ecr_repository_policy\" \"good\" {\n  policy = jsonencode({ Statement = [{ Effect = \"Allow\", Principal\
    \ = { AWS = \"arn:aws:iam::123:root\" }, Action = \"sqs:SendMessage\", Resource = \"*\" }] })\n}\n"
