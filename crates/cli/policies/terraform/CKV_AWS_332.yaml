metadata:
  id: CKV_AWS_332
  name: Ensure ECS services do not use outdated Fargate platform versions
  category: GENERAL_SECURITY
  severity: MEDIUM
  framework: terraform
  guidelines: Adapted from Checkov CKV_AWS_332. https://github.com/bridgecrewio/checkov
resource_types:
- aws_ecs_service
definition:
  or:
  - cond_type: attribute
    attribute: platform_version
    operator: not_exists
  - cond_type: attribute
    attribute: platform_version
    operator: equals
    value: LATEST
fixtures:
  fail: |
    resource "aws_ecs_service" "bad" {
      platform_version = "1.3.0"
    }
  pass: |
    resource "aws_ecs_service" "good" {
      platform_version = "LATEST"
    }
