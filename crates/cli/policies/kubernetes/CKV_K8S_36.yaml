metadata:
  id: CKV_K8S_36
  name: Minimize the admission of containers with capabilities assigned
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_36. https://github.com/bridgecrewio/checkov
resource_types:
- PodSecurityPolicy
definition:
  and:
  - cond_type: attribute
    attribute: spec.requiredDropCapabilities
    operator: exists
  - cond_type: attribute
    attribute: spec.requiredDropCapabilities
    operator: is_not_empty
fixtures:
  fail: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata: {name: bad}\nspec:\n  seLinux: {rule: RunAsAny}\n\
    \  runAsUser: {rule: RunAsAny}\n  fsGroup: {rule: RunAsAny}\n  supplementalGroups: {rule: RunAsAny}\n"
  pass: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata: {name: good}\nspec:\n  requiredDropCapabilities: [\"\
    ALL\"]\n  seLinux: {rule: RunAsAny}\n  runAsUser: {rule: RunAsAny}\n  fsGroup: {rule: RunAsAny}\n  supplementalGroups:\
    \ {rule: RunAsAny}\n"
