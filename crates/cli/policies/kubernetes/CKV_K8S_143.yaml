metadata:
  id: CKV_K8S_143
  name: Ensure that the --streaming-connection-idle-timeout argument is not set to 0
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_143. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "kubelet"
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "--streaming-connection-idle-timeout=0"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/kube-apiserver:v1.28.0
          command:
            - "kubelet"
            - "--streaming-connection-idle-timeout=0"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/kube-apiserver:v1.28.0
          command:
            - "kubelet"
