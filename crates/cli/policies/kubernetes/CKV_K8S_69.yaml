metadata:
  id: CKV_K8S_69
  name: Ensure that the --basic-auth-file argument is not set
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_69. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "kube-apiserver"
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "--basic-auth-file"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/kube-apiserver:v1.28.0
          command:
            - "kube-apiserver"
            - "--basic-auth-file"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/kube-apiserver:v1.28.0
          command:
            - "kube-apiserver"
