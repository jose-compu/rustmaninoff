metadata:
  id: CKV_K8S_112
  name: Ensure that the RotateKubeletServerCertificate argument is set to true
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_112. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.command
  operator: not_contains
  value: --feature-gates=RotateKubeletServerCertificate=false
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: kube-system}
    spec:
      containers:
        - name: app
          image: control:1
          command: ["kubelet", "--feature-gates=RotateKubeletServerCertificate=false"]
  pass: |
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: kube-system}
    spec:
      containers:
        - name: app
          image: control:1
          command: ["kubelet", "--feature-gates=RotateKubeletServerCertificate=true"]
