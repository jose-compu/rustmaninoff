metadata:
  id: CKV_K8S_119
  name: Ensure that the --peer-cert-file and --peer-key-file arguments are set as appropriate
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_119. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "etcd"
  - and:
    - cond_type: attribute
      attribute: _containers.command
      operator: contains
      value: "--peer-cert-file=/x"
    - cond_type: attribute
      attribute: _containers.command
      operator: contains
      value: "--peer-key-file=/x"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "etcd"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "etcd"
            - "--peer-cert-file=/x"
            - "--peer-key-file=/x"
