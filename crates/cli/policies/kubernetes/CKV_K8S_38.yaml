metadata:
  id: CKV_K8S_38
  name: Ensure that Service Account Tokens are only mounted where necessary
  category: KUBERNETES
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_38. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _pod_spec.automountServiceAccountToken
  operator: equals
  value: false
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  automountServiceAccountToken: true\n\
    \  containers:\n    - name: app\n      image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  automountServiceAccountToken: false\n\
    \  containers:\n    - name: app\n      image: nginx:1.25\n"
