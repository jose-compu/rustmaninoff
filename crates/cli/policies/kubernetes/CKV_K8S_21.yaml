metadata:
  id: CKV_K8S_21
  name: The default namespace should not be used
  category: KUBERNETES
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_21. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- DaemonSet
- StatefulSet
- ReplicaSet
- Job
- CronJob
- Service
- ConfigMap
- Secret
definition:
  cond_type: attribute
  attribute: metadata.namespace
  operator: not_equals
  value: default
  missing: fail
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: default\nspec:\n  containers:\n    - name: app\n\
    \      image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  containers:\n    - name: app\n  \
    \    image: nginx:1.25\n"
