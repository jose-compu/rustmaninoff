metadata:
  id: CKV_K8S_1
  name: Do not admit containers wishing to share the host process ID namespace
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_1. https://github.com/bridgecrewio/checkov
resource_types:
- PodSecurityPolicy
definition:
  or:
  - cond_type: attribute
    attribute: spec.hostPID
    operator: not_exists
  - cond_type: attribute
    attribute: spec.hostPID
    operator: equals
    value: false
fixtures:
  fail: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata:\n  name: bad\nspec:\n  hostPID: true\n  seLinux:\n\
    \    rule: RunAsAny\n  runAsUser:\n    rule: RunAsAny\n  fsGroup:\n    rule: RunAsAny\n  supplementalGroups:\n    rule:\
    \ RunAsAny\n"
  pass: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata:\n  name: good\nspec:\n  hostPID: false\n  seLinux:\n\
    \    rule: RunAsAny\n  runAsUser:\n    rule: RunAsAny\n  fsGroup:\n    rule: RunAsAny\n  supplementalGroups:\n    rule:\
    \ RunAsAny\n"
