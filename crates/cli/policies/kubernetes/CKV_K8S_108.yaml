metadata:
  id: CKV_K8S_108
  name: Ensure that the --use-service-account-credentials argument is set to true
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_108. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "kube-controller-manager"
  - and:
    - cond_type: attribute
      attribute: _containers.command
      operator: contains
      value: "--use-service-account-credentials=true"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kube-controller-manager"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kube-controller-manager"
            - "--use-service-account-credentials=true"
