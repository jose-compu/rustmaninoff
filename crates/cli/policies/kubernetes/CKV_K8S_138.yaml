metadata:
  id: CKV_K8S_138
  name: Ensure that the --anonymous-auth argument is set to false
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_138. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "kubelet"
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "--anonymous-auth=true"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/control:v1
          command:
            - "kubelet"
            - "--anonymous-auth=true"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/control:v1
          command:
            - "kubelet"
