metadata:
  id: CKV_K8S_78
  name: Ensure that the admission control plugin EventRateLimit is set
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_78. https://github.com/bridgecrewio/checkov
resource_types:
- AdmissionConfiguration
definition:
  cond_type: attribute
  attribute: plugins.name
  operator: contains
  value: EventRateLimit
fixtures:
  fail: "apiVersion: apiserver.config.k8s.io/v1\nkind: AdmissionConfiguration\nplugins:\n  - name: Other\n"
  pass: "apiVersion: apiserver.config.k8s.io/v1\nkind: AdmissionConfiguration\nplugins:\n  - name: EventRateLimit\n"
