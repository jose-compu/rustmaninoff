metadata:
  id: CKV_K8S_77
  name: Ensure that the --authorization-mode argument includes RBAC
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_77. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "kube-apiserver"
  - and:
    - cond_type: attribute
      attribute: _containers.command
      operator: contains
      value: "--authorization-mode=RBAC"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/kube-apiserver:v1.28.0
          command:
            - "kube-apiserver"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: k8s.gcr.io/kube-apiserver:v1.28.0
          command:
            - "kube-apiserver"
            - "--authorization-mode=RBAC"
