metadata:
  id: CKV_K8S_121
  name: Ensure that the --peer-client-cert-auth argument is set to true
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_121. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: etcd
  - cond_type: attribute
    attribute: _containers.command
    operator: contains
    value: --peer-client-cert-auth=true
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "etcd"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "etcd"
            - "--peer-client-cert-auth=true"
