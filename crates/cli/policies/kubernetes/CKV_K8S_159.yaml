metadata:
  id: CKV_K8S_159
  name: Limit the use of git-sync to prevent code injection
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_159.
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: no_element
  attribute: _containers.env
  where:
    cond_type: attribute
    attribute: name
    operator: equals
    value: GITSYNC_GIT
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata: {name: bad}\nspec:\n  containers:\n    - name: sync\n      image: git-sync:1\n\
    \      env:\n        - name: GITSYNC_GIT\n          value: \"git\"\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata: {name: good}\nspec:\n  containers:\n    - name: sync\n      image: git-sync:1\n\
    \      env:\n        - name: OTHER\n          value: \"x\"\n"
