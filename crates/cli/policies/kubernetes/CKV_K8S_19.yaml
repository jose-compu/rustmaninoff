metadata:
  id: CKV_K8S_19
  name: Containers should not share the host network namespace
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_19. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _pod_spec.hostNetwork
  operator: not_equals
  value: true
  missing: pass
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  hostNetwork: true\n  containers:\n\
    \    - name: app\n      image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  hostNetwork: false\n  containers:\n\
    \    - name: app\n      image: nginx:1.25\n"
