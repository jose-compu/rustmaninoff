metadata:
  id: CKV_K8S_16
  name: Container should not be privileged
  category: KUBERNETES
  severity: CRITICAL
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_16. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.securityContext.privileged
  operator: not_equals
  value: true
  missing: pass
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n      securityContext:\n        privileged: true\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  containers:\n    - name: app\n  \
    \    image: nginx:1.25\n      securityContext:\n        privileged: false\n"
