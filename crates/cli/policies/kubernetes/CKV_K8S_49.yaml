metadata:
  id: CKV_K8S_49
  name: Minimize wildcard use in Roles and ClusterRoles
  category: IAM
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_49. https://github.com/bridgecrewio/checkov
resource_types:
- Role
- ClusterRole
definition:
  cond_type: no_element
  attribute: rules
  where:
    or:
    - cond_type: attribute
      attribute: verbs
      operator: equals_any
      value: '*'
    - cond_type: attribute
      attribute: resources
      operator: equals_any
      value: '*'
fixtures:
  fail: "apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: bad\nrules:\n  - apiGroups: [\"\"\
    ]\n    resources: [\"pods\"]\n    verbs: [\"*\"]\n"
  pass: "apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: good\nrules:\n  - apiGroups: [\"\"\
    ]\n    resources: [\"pods\"]\n    verbs: [\"get\", \"list\"]\n"
