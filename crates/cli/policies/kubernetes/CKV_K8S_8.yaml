metadata:
  id: CKV_K8S_8
  name: Liveness Probe Should be Configured
  category: KUBERNETES
  severity: LOW
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_8. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.livenessProbe
  operator: exists
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  containers:\n    - name: app\n  \
    \    image: nginx:1.25\n      livenessProbe:\n        httpGet:\n          path: /health\n          port: 80\n"
