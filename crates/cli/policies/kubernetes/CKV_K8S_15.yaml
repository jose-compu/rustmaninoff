metadata:
  id: CKV_K8S_15
  name: Image Pull Policy should be Always
  category: KUBERNETES
  severity: LOW
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_15. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.imagePullPolicy
  operator: equals
  value: Always
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n      imagePullPolicy: IfNotPresent\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  containers:\n    - name: app\n  \
    \    image: nginx:1.25\n      imagePullPolicy: Always\n"
