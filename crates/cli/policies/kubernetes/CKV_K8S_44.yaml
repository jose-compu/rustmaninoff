metadata:
  id: CKV_K8S_44
  name: Ensure that the Tiller Service (Helm v2) is deleted
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_44. https://github.com/bridgecrewio/checkov
resource_types:
- Service
definition:
  and:
  - cond_type: attribute
    attribute: metadata.name
    operator: not_equals
    value: tiller-deploy
  - cond_type: attribute
    attribute: metadata.name
    operator: not_contains
    value: tiller
fixtures:
  fail: |
    apiVersion: v1
    kind: Service
    metadata:
      name: tiller-deploy
      namespace: kube-system
    spec:
      ports:
        - port: 44134
          targetPort: 44134
      selector:
        app: helm
        name: tiller
  pass: |
    apiVersion: v1
    kind: Service
    metadata:
      name: app
      namespace: prod
    spec:
      ports:
        - port: 80
          targetPort: 80
      selector:
        app: app
