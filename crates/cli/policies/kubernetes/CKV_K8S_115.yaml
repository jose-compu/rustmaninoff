metadata:
  id: CKV_K8S_115
  name: Ensure that the --bind-address argument is set to 127.0.0.1
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_115. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: "kube-scheduler"
  - and:
    - cond_type: attribute
      attribute: _containers.command
      operator: contains
      value: "--bind-address=127.0.0.1"
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kube-scheduler"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kube-scheduler"
            - "--bind-address=127.0.0.1"
