metadata:
  id: CKV_K8S_95
  name: Ensure that the --request-timeout argument is set as appropriate
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: 'Adapted from Checkov CKV_K8S_95. Approximation: forbids known-invalid exact flag values; unset passes like
    Checkov. https://github.com/bridgecrewio/checkov'
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: kube-apiserver
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: --request-timeout=invalid
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata: {name: app, namespace: kube-system}\nspec:\n  containers:\n    - name: app\n\
    \      image: control:1\n      command: [\"kube-apiserver\", \"--request-timeout=invalid\"]\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata: {name: app, namespace: kube-system}\nspec:\n  containers:\n    - name: app\n\
    \      image: control:1\n      command: [\"kube-apiserver\", \"--request-timeout=60s\"]\n"
