metadata:
  id: CKV_K8S_11
  name: CPU limits should be set
  category: KUBERNETES
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_11. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.resources.limits.cpu
  operator: exists
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  containers:\n    - name: app\n  \
    \    image: nginx:1.25\n      resources:\n        limits:\n          cpu: 500m\n"
