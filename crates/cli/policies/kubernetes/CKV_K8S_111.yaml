metadata:
  id: CKV_K8S_111
  name: Ensure that the --root-ca-file argument is set as appropriate
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_111. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: kube-controller-manager
  - cond_type: attribute
    attribute: _containers.command
    operator: contains
    value: --root-ca-file=/etc/kubernetes/pki/ca.crt
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kube-controller-manager"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kube-controller-manager"
            - "--root-ca-file=/etc/kubernetes/pki/ca.crt"
