metadata:
  id: CKV_K8S_45
  name: Ensure the Tiller Deployment (Helm V2) is not accessible from within the cluster
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_45. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.image
    operator: not_contains
    value: tiller
  - cond_type: attribute
    attribute: _containers.args
    operator: contains
    value: --listen=localhost:44134
  - cond_type: attribute
    attribute: _containers.command
    operator: contains
    value: --listen=localhost:44134
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata: {name: tiller, namespace: kube-system}\nspec:\n  containers:\n    - name: tiller\n\
    \      image: gcr.io/kubernetes-helm/tiller:v2.16.0\n      args: [\"--listen=:44134\"]\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata: {name: tiller, namespace: kube-system}\nspec:\n  containers:\n    - name: tiller\n\
    \      image: gcr.io/kubernetes-helm/tiller:v2.16.0\n      args: [\"--listen=localhost:44134\"]\n"
