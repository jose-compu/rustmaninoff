metadata:
  id: CKV_K8S_39
  name: Do not use the CAP_SYS_ADMIN linux capability
  category: KUBERNETES
  severity: CRITICAL
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_39. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.securityContext.capabilities.add
  operator: not_contains
  value: SYS_ADMIN
  missing: pass
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n      securityContext:\n        capabilities:\n          add:\n            - SYS_ADMIN\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  containers:\n    - name: app\n  \
    \    image: nginx:1.25\n"
