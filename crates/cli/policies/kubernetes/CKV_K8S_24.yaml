metadata:
  id: CKV_K8S_24
  name: Minimize the admission of containers with hostPath volumes
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_24. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _pod_spec.volumes.hostPath
  operator: not_exists
  missing: pass
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: bad
      namespace: prod
    spec:
      containers:
        - name: app
          image: nginx:1.25
      volumes:
        - name: host
          hostPath:
            path: /var/run/docker.sock
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: good
      namespace: prod
    spec:
      containers:
        - name: app
          image: nginx:1.25
      volumes:
        - name: tmp
          emptyDir: {}
