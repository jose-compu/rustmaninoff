metadata:
  id: CKV_K8S_31
  name: Ensure that the seccomp profile is set to RuntimeDefault or Localhost
  category: KUBERNETES
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_31. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _pod_spec.securityContext.seccompProfile.type
  operator: within
  value:
  - RuntimeDefault
  - Localhost
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  securityContext:\n    seccompProfile:\n\
    \      type: RuntimeDefault\n  containers:\n    - name: app\n      image: nginx:1.25\n"
