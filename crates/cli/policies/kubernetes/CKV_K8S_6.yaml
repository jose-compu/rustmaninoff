metadata:
  id: CKV_K8S_6
  name: Do not admit root containers
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_6. https://github.com/bridgecrewio/checkov
resource_types:
- PodSecurityPolicy
definition:
  cond_type: attribute
  attribute: spec.runAsUser.rule
  operator: equals
  value: MustRunAsNonRoot
fixtures:
  fail: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata: {name: bad}\nspec:\n  seLinux: {rule: RunAsAny}\n\
    \  runAsUser: {rule: RunAsAny}\n  fsGroup: {rule: RunAsAny}\n  supplementalGroups: {rule: RunAsAny}\n"
  pass: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata: {name: good}\nspec:\n  seLinux: {rule: RunAsAny}\n\
    \  runAsUser: {rule: MustRunAsNonRoot}\n  fsGroup: {rule: RunAsAny}\n  supplementalGroups: {rule: RunAsAny}\n"
