metadata:
  id: CKV_K8S_42
  name: Ensure that default service accounts are not actively used
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_42. https://github.com/bridgecrewio/checkov
resource_types:
- RoleBinding
- ClusterRoleBinding
definition:
  cond_type: no_element
  attribute: subjects
  where:
    and:
    - cond_type: attribute
      attribute: kind
      operator: equals
      value: ServiceAccount
    - cond_type: attribute
      attribute: name
      operator: equals
      value: default
fixtures:
  fail: "apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata: {name: bad, namespace: default}\nroleRef:\
    \ {apiGroup: rbac.authorization.k8s.io, kind: Role, name: edit}\nsubjects:\n  - kind: ServiceAccount\n    name: default\n\
    \    namespace: default\n"
  pass: "apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata: {name: good, namespace: default}\nroleRef:\
    \ {apiGroup: rbac.authorization.k8s.io, kind: Role, name: edit}\nsubjects:\n  - kind: ServiceAccount\n    name: app\n\
    \    namespace: default\n"
