metadata:
  id: CKV_K8S_7
  name: Do not admit containers with the NET_RAW capability
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_7. https://github.com/bridgecrewio/checkov
resource_types:
- PodSecurityPolicy
definition:
  cond_type: attribute
  attribute: spec.requiredDropCapabilities
  operator: contains
  value: NET_RAW
fixtures:
  fail: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata: {name: bad}\nspec:\n  seLinux: {rule: RunAsAny}\n\
    \  runAsUser: {rule: RunAsAny}\n  fsGroup: {rule: RunAsAny}\n  supplementalGroups: {rule: RunAsAny}\n"
  pass: "apiVersion: policy/v1beta1\nkind: PodSecurityPolicy\nmetadata: {name: good}\nspec:\n  requiredDropCapabilities: [\"\
    NET_RAW\"]\n  seLinux: {rule: RunAsAny}\n  runAsUser: {rule: RunAsAny}\n  fsGroup: {rule: RunAsAny}\n  supplementalGroups:\
    \ {rule: RunAsAny}\n"
