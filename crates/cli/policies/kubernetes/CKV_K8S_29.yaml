metadata:
  id: CKV_K8S_29
  name: Apply security context to your pods and containers
  category: KUBERNETES
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_29. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _pod_spec.securityContext
  operator: exists
fixtures:
  fail: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bad\n  namespace: prod\nspec:\n  containers:\n    - name: app\n   \
    \   image: nginx:1.25\n"
  pass: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: good\n  namespace: prod\nspec:\n  securityContext:\n    runAsNonRoot:\
    \ true\n  containers:\n    - name: app\n      image: nginx:1.25\n"
