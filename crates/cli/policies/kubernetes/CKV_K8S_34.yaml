metadata:
  id: CKV_K8S_34
  name: Prefer using secrets as files over secrets as envFrom
  category: SECRETS
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_34. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  cond_type: attribute
  attribute: _containers.envFrom.secretRef
  operator: not_exists
  missing: pass
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: bad
      namespace: prod
    spec:
      containers:
        - name: app
          image: nginx:1.25
          envFrom:
            - secretRef:
                name: app-secret
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: good
      namespace: prod
    spec:
      containers:
        - name: app
          image: nginx:1.25
