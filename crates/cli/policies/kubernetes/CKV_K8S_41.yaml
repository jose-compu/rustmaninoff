metadata:
  id: CKV_K8S_41
  name: Ensure that default service accounts are not actively used
  category: IAM
  severity: MEDIUM
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_41. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  and:
  - cond_type: attribute
    attribute: _pod_spec.serviceAccountName
    operator: exists
  - cond_type: attribute
    attribute: _pod_spec.serviceAccountName
    operator: not_equals
    value: default
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: bad
      namespace: prod
    spec:
      serviceAccountName: default
      containers:
        - name: app
          image: nginx:1.25
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: good
      namespace: prod
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: nginx:1.25
