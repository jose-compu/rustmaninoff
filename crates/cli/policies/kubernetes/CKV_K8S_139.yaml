metadata:
  id: CKV_K8S_139
  name: Ensure that the --authorization-mode argument is not set to AlwaysAllow
  category: KUBERNETES
  severity: HIGH
  framework: kubernetes
  guidelines: Adapted from Checkov CKV_K8S_139. https://github.com/bridgecrewio/checkov
resource_types:
- Pod
- Deployment
- StatefulSet
- DaemonSet
- Job
- CronJob
- ReplicaSet
definition:
  or:
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: kubelet
  - cond_type: attribute
    attribute: _containers.command
    operator: not_contains
    value: --authorization-mode=AlwaysAllow
fixtures:
  fail: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kubelet"
            - "--authorization-mode=AlwaysAllow"
  pass: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: app
      namespace: kube-system
    spec:
      containers:
        - name: app
          image: control:1
          command:
            - "kubelet"
            - "--authorization-mode=Webhook"
